<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official Home</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">
  <link href="https://fonts.googleapis.com/css?family=Comfortaa:300,400" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); color: var(--blm-ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* --- HERO BANNER (big slide on top, thumbnail strip looping below) --- */
    .hero-banner { max-width: 1300px; width: 92%; margin: 28px auto 0; }
    .hero-banner-main {
      position: relative; width: 100%;
      aspect-ratio: 1445 / 820;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--blm-paper-soft);
      border: 1px solid var(--blm-line);
    }
    .hero-swiper, .hero-swiper .swiper-slide { width: 100%; height: 100%; }
    .hero-slide-link { display: block; width: 100%; height: 100%; }
    .hero-slide-link img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-slide-loading { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: var(--blm-ink-faint); font-weight: 600; }
    .hero-slide-caption {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 30px clamp(20px, 4vw, 44px) 22px;
      background: linear-gradient(0deg, rgba(59,47,38,0.55) 0%, rgba(59,47,38,0) 100%);
      color: #fff;
    }
    .hero-slide-caption-title { font-family: var(--font-display); font-size: clamp(18px, 2.6vw, 28px); font-weight: 700; }
    .hero-slide-caption-sub { font-size: 12.5px; font-weight: 600; opacity: 0.85; margin-top: 4px; }

    .hero-nav-prev, .hero-nav-next {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.85); border: 1px solid var(--blm-line);
      color: var(--blm-ink); display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 6; transition: background 0.2s, color 0.2s;
    }
    .hero-nav-prev:hover, .hero-nav-next:hover { background: var(--blm-gold); color: var(--blm-on-gold); }
    .hero-nav-prev { left: 16px; } .hero-nav-next { right: 16px; }
    .hero-nav-prev.swiper-button-disabled, .hero-nav-next.swiper-button-disabled { opacity: 0.35; cursor: default; }

    .hero-fraction {
      position: absolute !important; right: 20px; top: 18px; left: auto !important; bottom: auto !important; width: auto !important; z-index: 6;
      display: flex; align-items: baseline; gap: 3px;
      font-family: var(--font-display); font-weight: 700; color: #fff; font-size: 13px;
      background: rgba(59,47,38,0.45); padding: 5px 12px; border-radius: var(--radius-pill);
    }
    .hero-fraction .swiper-pagination-current { font-size: 20px; }
    .hero-fraction .swiper-pagination-total { opacity: 0.7; }

    .hero-thumbs { margin-top: 14px; }
    .hero-thumbs .swiper-slide {
      width: clamp(88px, 12vw, 150px); aspect-ratio: 16/9;
      border-radius: var(--radius-md); overflow: hidden; cursor: pointer;
      opacity: 0.5; border: 2px solid transparent; transition: opacity 0.25s, border-color 0.25s;
    }
    .hero-thumbs .swiper-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-thumbs .swiper-slide:hover { opacity: 0.8; }
    .hero-thumbs .swiper-slide-thumb-active { opacity: 1; border-color: var(--blm-gold); }

    /* --- BIRTHDAY BANNER --- */
    .birthday-banner {
      max-width: 1300px; width: 92%; margin: 28px auto 48px;
      border: 3px double var(--blm-gold-deep);
      border-radius: var(--radius-lg);
      padding: 18px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
      background: var(--blm-gold-pale);
    }
    .birthday-banner-label {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-display); font-weight: 800; font-size: 15px;
      color: var(--blm-gold-deep); letter-spacing: 0.3px; white-space: nowrap;
    }
    .birthday-chips { display: flex; gap: 10px; flex-wrap: wrap; }
    .birthday-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--blm-gold); color: var(--blm-on-gold); text-decoration: none;
      padding: 5px 16px 5px 5px; border-radius: var(--radius-pill);
      font-weight: 700; font-size: 13px;
      transition: transform 0.2s, background 0.2s;
    }
    .birthday-chip:hover { background: var(--blm-gold-deep); transform: translateY(-2px); }
    .birthday-chip img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.7); }
    .birthday-empty { font-size: 13.5px; font-weight: 600; color: var(--blm-gold-deep); opacity: 0.75; }
    @media (max-width: 640px) { .birthday-banner { flex-direction: column; align-items: flex-start; } }

    .sec-head.no-underline { border-bottom: none; padding-bottom: 0; }

    /* --- NEWS & SCHEDULE --- */
    .content-box-section { max-width: 1300px; width: 92%; margin: 0 auto 76px; display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
    @media (max-width: 900px) { .content-box-section { grid-template-columns: 1fr; gap: 56px; } }
    .data-list { display: flex; flex-direction: column; margin-bottom: 20px; }
    .data-row { display: flex; align-items: center; gap: 18px; text-decoration: none; color: inherit; padding: 16px 0; border-bottom: 1px solid var(--blm-line); }
    .data-row:first-child { padding-top: 0; }
    .data-row:hover { background: var(--blm-paper-soft); border-radius: var(--radius-md); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
    .data-row:hover .data-title { color: var(--blm-pink-deep); }
    @media (max-width: 600px) { .data-row { flex-direction: column; align-items: flex-start; gap: 8px; } }
    .data-date-group { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 96px; flex-shrink: 0; }
    .data-date { font-size: 12px; color: var(--blm-ink-faint); font-weight: 600; }
    .data-title { font-size: 14.5px; font-weight: 600; color: var(--blm-ink); line-height: 1.4; transition: color 0.2s; }

    /* --- News column: thumbnail + tag + date + NEW badge rows --- */
    .home-news-row {
      display: flex; align-items: flex-start; gap: 14px;
      text-decoration: none; color: inherit;
      padding: 16px 0; border-bottom: 1px solid var(--blm-line);
      transition: background 0.2s, padding 0.2s;
    }
    .home-news-row:first-child { padding-top: 0; }
    .home-news-row:hover { background: var(--blm-paper-soft); border-radius: var(--radius-md); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
    .home-news-thumb {
      width: 88px; height: 88px; flex-shrink: 0;
      overflow: hidden; background: var(--blm-paper-soft);
      border: 1px solid var(--blm-line); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .home-news-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .home-news-thumb-placeholder { font-family: var(--font-display); font-weight: 800; font-size: 9.5px; letter-spacing: 2px; color: var(--blm-ink-faint); text-transform: uppercase; }
    .home-news-content { flex-grow: 1; min-width: 0; padding-top: 2px; }
    .home-news-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .home-news-cat-tag {
      border: 1px solid var(--blm-tag-color, var(--blm-ink-faint));
      color: var(--blm-tag-color, var(--blm-ink-faint));
      font-size: 9.5px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase;
      padding: 2px 8px;
    }
    .home-news-date { font-size: 11.5px; color: var(--blm-ink-faint); font-weight: 600; }
    .home-news-new { font-size: 10px; font-weight: 800; letter-spacing: 0.5px; color: var(--blm-pink-deep); text-transform: uppercase; }
    .home-news-title {
      font-size: 13.5px; font-weight: 700; color: var(--blm-ink); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      transition: color 0.2s;
    }
    .home-news-row:hover .home-news-title { color: var(--blm-pink-deep); }
    @media (max-width: 600px) { .home-news-thumb { width: 72px; height: 72px; } }

    /* --- Schedule column: big date + tag + NEW badge rows --- */
    .home-sched-row {
      display: flex; align-items: flex-start; gap: 20px;
      text-decoration: none; color: inherit;
      padding: 16px 0; border-bottom: 1px solid var(--blm-line);
      transition: background 0.2s, padding 0.2s;
    }
    .home-sched-row:first-child { padding-top: 0; }
    .home-sched-row:hover { background: var(--blm-paper-soft); border-radius: var(--radius-md); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
    .home-sched-date-block { min-width: 70px; flex-shrink: 0; }
    .home-sched-date-big { font-family: var(--font-display); font-size: 25px; font-weight: 800; color: var(--blm-ink); line-height: 1; display: block; }
    .home-sched-date-sub { font-size: 10.5px; color: var(--blm-ink-faint); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 5px; display: block; }
    .home-sched-content { flex-grow: 1; min-width: 0; padding-top: 4px; }
    .home-sched-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .home-sched-cat-tag {
      border: 1px solid var(--blm-tag-color, var(--blm-ink-faint));
      color: var(--blm-tag-color, var(--blm-ink-faint));
      font-size: 9.5px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase;
      padding: 2px 8px;
    }
    .home-sched-new { font-size: 10px; font-weight: 800; letter-spacing: 0.5px; color: var(--blm-pink-deep); text-transform: uppercase; }
    .home-sched-title {
      font-size: 13.5px; font-weight: 700; color: var(--blm-ink); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      transition: color 0.2s;
    }
    .home-sched-row:hover .home-sched-title { color: var(--blm-pink-deep); }

    /* --- CHAMP OF THE MONTH --- */
    .champ-section { max-width: 1300px; width: 92%; margin: 0 auto 100px; }

    /* --- VIDEO SECTION --- */
    .video-section { max-width: 1300px; width: 92%; margin: 0 auto 90px; position: relative; }
    /* MOVIE uses the shared vision carousel (.release-carousel / .rc-*) with the wide edge-on preset */
    .release-carousel.movie-carousel { aspect-ratio: 3 / 1; }
    @media (max-width: 768px) { .release-carousel.movie-carousel { aspect-ratio: 2 / 1; } }
    @media (max-width: 480px) { .release-carousel.movie-carousel { aspect-ratio: 16 / 9; } }
    .mc-play { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); color: var(--blm-pink-deep); display: flex; align-items: center; justify-content: center; font-size: 56px; padding-left: 10px; box-shadow: 0 12px 40px rgba(51, 38, 31, 0.25); transition: transform 0.3s, background 0.3s, color 0.3s; }
    .rc-card:hover .mc-play { transform: scale(1.08); background: var(--blm-pink); color: #fff; }
    @media (max-width: 600px) { .mc-play { transform: scale(1.6); } }
    .movie-note { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--blm-pink-deep); margin-bottom: 4px; }

    /* --- LATEST RELEASE (Discography) --- */
    .release-section { max-width: 1300px; width: 92%; margin: 0 auto 90px; }
    /* 3D "vision" carousel: every Discography cover rides a tilted ellipse (see renderLatestRelease) */
    .release-carousel { position: relative; width: 100%; aspect-ratio: 2 / 1; overflow: hidden; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
    @media (max-width: 768px) { .release-carousel { aspect-ratio: 16 / 10; } }
    @media (max-width: 480px) { .release-carousel { aspect-ratio: 4 / 3; } }
    .release-carousel.is-dragging { cursor: grabbing; }
    .rc-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--blm-ink-faint); font-weight: 600; }
    .rc-scaler { position: absolute; left: 50%; top: 50%; width: 3840px; height: 2160px; transform-origin: 0 0; }
    .rc-stage { position: absolute; inset: 0; perspective: 5669px; perspective-origin: 50% 50%; }
    .rc-group { position: absolute; inset: 0; transform-style: preserve-3d; }
    .rc-card { position: absolute; left: 0; top: 0; display: block; will-change: transform; }
    .rc-card-inner { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 24px; background: var(--blm-paper-soft); opacity: 0; transform: scale(0.72); transition: opacity 0.55s cubic-bezier(0.25, 1, 0.5, 1), transform 0.55s cubic-bezier(0.25, 1, 0.5, 1); transition-delay: var(--rc-delay, 0ms); }
    .release-carousel.is-in .rc-card-inner { opacity: 1; transform: scale(1); }
    .rc-card img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
    .release-caption { text-align: center; margin-top: 8px; min-height: 48px; }
    .release-title { font-size: 16px; font-weight: 700; color: var(--blm-ink); line-height: 1.4; margin-bottom: 4px; }
    .release-title a { color: inherit; text-decoration: none; transition: color 0.2s; }
    .release-title a:hover { color: var(--blm-pink-deep); }
    .release-date { font-size: 12px; color: var(--blm-ink-faint); font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { .rc-card-inner { transition: none; } }
    .release-more { display: flex; justify-content: center; margin-top: 32px; }

    /* --- GROUP NETWORK --- */
    .group-band { background: var(--blm-paper-soft); border-top: 1px solid var(--blm-line); border-bottom: 1px solid var(--blm-line); padding: 56px 0; }
    .group-inner { max-width: 1300px; width: 92%; margin: 0 auto; text-align: center; }
    .logo-grid {
      display: flex; flex-wrap: nowrap; align-items: center; justify-content: flex-start;
      gap: clamp(10px, 2vw, 28px);
      overflow-x: auto; padding: 4px 2px 10px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 1180px) { .logo-grid { justify-content: center; } }
    .logo-grid::-webkit-scrollbar { height: 5px; }
    .logo-grid::-webkit-scrollbar-thumb { background: var(--blm-line); }
    .logo-grid a { flex: 0 0 auto; scroll-snap-align: start; display: flex; justify-content: center; opacity: 0.85; transition: opacity 0.2s, transform 0.2s; }
    .logo-grid a:hover { opacity: 1; transform: translateY(-3px); }
    .logo-grid img { width: clamp(42px, 5.2vw, 70px); height: auto; flex-shrink: 0; }

    /* --- LINK BANNERS --- */
    .link-banners { max-width: 1300px; width: 92%; margin: 56px auto 90px; }
    .link-banners-grid { display: flex; flex-wrap: wrap; gap: 16px; }
    .link-banner-tile {
      flex: 1 1 260px;
      aspect-ratio: 2048 / 546;
      display: block;
      overflow: hidden;
      border-radius: var(--radius-md);
      border: 1px solid var(--blm-line);
      background: var(--blm-paper-soft);
    }
    .link-banner-tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
    .link-banner-tile:hover img { transform: scale(1.04); }
  </style>
</head>

  <!-- VIDEO -->

    function renderBirthdayMonth() {
      const today = new Date();
      const listEl = document.getElementById('birthdayList');

        .map(m => {

  <script>
    function homeIsRecent(dateValue) {
      const d = dateValue instanceof Date ? dateValue : new Date(dateValue);
      if (isNaN(d)) return false;
      const diffDays = (Date.now() - d.getTime()) / (1000 * 60 * 60 * 24);
      return diffDays >= 0 && diffDays <= 3;
    }

    // News column - same palette + alphabetical-order lookup as news.html,
    // so a given tag always renders the same color on both pages.
    const NEWS_TAG_PALETTE = ['#f5629e', '#4d8fdb', '#7ec8e3', '#c9932c', '#9b7fd4', '#6fbf8b', '#8a7c68'];
    function newsTagOrderFrom(items) {
      const seen = {}; const tags = [];
      items.forEach(item => {
        const key = (item.tag || '').trim().toLowerCase();
        if (key && !seen[key]) { seen[key] = true; tags.push(key); }
      });
      return tags.sort();
    }
    function newsTagColor(tag, tagOrder) {
      const idx = tagOrder.indexOf((tag || '').toLowerCase());
      return NEWS_TAG_PALETTE[idx % NEWS_TAG_PALETTE.length] || 'var(--blm-ink-faint)';
    }

    async function renderHomeNews() {
      const listEl = document.getElementById('homeNewsList');
      try {
        const rows = await BLM48Data.fetchSheet('News');

          .map(r => ({ ...r, _date: BLM48Data.fmtDate(r.date) }))
          .sort((a, b) => b._date.time - a._date.time)

        if (!items.length) {
          listEl.innerHTML = `<div class="home-news-row" style="border-bottom:none;"><div class="home-news-title" style="color:var(--blm-ink-faint);">No news yet.</div></div>`;

                  <span class="home-news-cat-tag" style="--blm-tag-color:${newsTagColor(item.tag, tagOrder)};">${item.tag || 'News'}</span>

    const SCHEDULE_TAG_PALETTE = ['#f5629e', '#6fbf8b', '#9b7fd4', '#4d8fdb', '#7ec8e3', '#e07a3f', '#8a7c68', '#c9932c'];
    function scheduleTagOrderFrom(rawRows) {
      const seen = {}; const tags = [];
      rawRows.forEach(item => {
        const key = (item.tag || '').trim().toLowerCase();

    /* ---- 3D "vision" carousels (ported from the Carousel Vision rigs) ----
       Cards ride a closed bezier ellipse in a 3840x2160 comp. The ellipse is tilted
       around X (xSlider), cards turn toward the camera and yaw at the sides.
       The card nearest the camera (bottom of the path) is the "front" one; the
       newest item starts there and older ones follow in order. */
    const RC_COMP = { width: 3840, height: 2160, camera: 5669.2913 };
    const RC_PRESETS = {
      // Vision 1 — ring seen from just above, far cards shrink to nothing
      release: {
        ctl: { scaleDepth: 130, scaleMin: -45.8, globalScale: 100, xSlider: -106, yAngle3d: -70,
               parentPos: [1920, 1299, 0], parentAnchor: [1920, 1080, 0] },
        speed: 0.02,          // ring turns per second (one lap ≈ 50s)
        intro: 0.755,         // extra spin eased in when the section first appears
        vertices: [
          { p: [1920, 230.6],     in: [-463.087, 0], out: [463.087, 0] },
          { p: [2758.5, 1101.45], in: [0, -480.953], out: [0, 480.953] },
          { p: [1920, 1972.3],    in: [463.087, 0],  out: [-463.087, 0] },
          { p: [1081.5, 1101.45], in: [0, 480.953],  out: [0, -480.953] },
        ],
        // visible ring ≈ 2800x1200 comp px around (1920, 1130)
        frame: { w: 2800, wNarrow: 2000, h: 1200, cx: 1920, cy: 1130 },
      },
      // Vision 5 — wide ring seen edge-on, cards slide along one horizon line
      movie: {
        ctl: { scaleDepth: 56.7, scaleMin: 0, globalScale: 88.4, xSlider: -90, yAngle3d: -50,
               parentPos: [1920, 1080, 0], parentAnchor: [1920, 1080, 0] },
        speed: 0.04,          // original was 0.1; slowed so the caption stays readable
        intro: -0.65,
        vertices: [
          { p: [1901.05, 430.925],   in: [-786.051, 0], out: [786.051, 0] },
          { p: [3324.334, 1099.05],  in: [0, -368.992], out: [0, 368.992] },
          { p: [1901.05, 1767.175],  in: [786.051, 0],  out: [-786.051, 0] },
          { p: [477.766, 1099.05],   in: [0, 368.992],  out: [0, -368.992] },
        ],
        frame: { w: 3700, wNarrow: 2300, h: 1000, cx: 1920, cy: 1080 },
      },
    };

    function rcBuildPath(vertices, center) {
      const pts = [], S = 64, n = vertices.length;
      for (let s = 0; s < n; s++) {
        const a = vertices[s], b = vertices[(s + 1) % n];
        const p0 = a.p, p1 = [a.p[0] + a.out[0], a.p[1] + a.out[1]], p2 = [b.p[0] + b.in[0], b.p[1] + b.in[1]], p3 = b.p;
        for (let k = 0; k < (s === n - 1 ? S + 1 : S); k++) {
          const t = k / S, m = 1 - t;
          pts.push([0, 1].map(d => m * m * m * p0[d] + 3 * m * m * t * p1[d] + 3 * m * t * t * p2[d] + t * t * t * p3[d]));
        }
      }
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      pts.forEach(q => { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); });
      const sx = center[0] - (x0 + x1) / 2, sy = center[1] - (y0 + y1) / 2;
      pts.forEach(q => { q[0] += sx; q[1] += sy; });
      const cum = [0];
      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      const total = cum[cum.length - 1];
      return function pointOnPath(pct) {
        pct = ((pct % 1) + 1) % 1;
        const target = pct * total;
        let lo = 0, hi = cum.length - 1;
        while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= target) lo = mid; else hi = mid; }
        const f = (target - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
        return [pts[lo][0] + (pts[hi][0] - pts[lo][0]) * f, pts[lo][1] + (pts[hi][1] - pts[lo][1]) * f];
      };
    }

    function rcPoses(ctl, pointOnPath, n, u) {
      const comp = RC_COMP, DEG = 180 / Math.PI;
      const cx = comp.width / 2, cy = comp.height / 2, maxDist = Math.hypot(cx, cy);
      const lin = (v, a, b, c, d) => c + (d - c) * Math.min(1, Math.max(0, (v - a) / (b - a)));
      const ease = (v, a, b, c, d) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return c + (d - c) * (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2); };
      const rx = ctl.xSlider / DEG, A = ctl.parentAnchor, P = ctl.parentPos;
      const out = [];
      for (let i = 0; i < n; i++) {
        // pct 0.5 is the bottom of the path = nearest the camera
        const pos = pointOnPath(0.5 + u - i / n);
        const norm = ((pos[1] - cy) / maxDist + 1) / 2;
        const depthScale = lin(norm, 0, 1, ctl.scaleMin, 100);
        const scale = lin(ctl.scaleDepth / 100, 0, 1, 100, depthScale) * (ctl.globalScale / 100) / 100;
        const lx = pos[0] - A[0], ly = pos[1] - A[1];
        const x = P[0] + lx, y = P[1] + ly * Math.cos(rx), z = P[2] + ly * Math.sin(rx);
        const vx = cx - x, vy = cy - y, vz = -comp.camera - z;
        let rotY = Math.atan2(vx, -vz) * DEG;
        const rotX = -Math.atan2(vy, Math.hypot(vx, vz)) * DEG;
        let r = ease(Math.abs(x - cx), 0, comp.width * (700 / 1920), 0, ctl.yAngle3d);
        if (x < cx) r = -r;
        rotY += r;
        out.push({ x, y, z, scale, rotY, rotX });
      }
      return out;
    }

    function rcSetStatus(wrap, msg) {
      wrap.innerHTML = '';
      const p = document.createElement('p'); p.className = 'rc-status'; p.textContent = msg;
      wrap.appendChild(p);
    }

    /* opts: { wrap, captionEl, items, preset, cardW, cardH,
               hrefOf(item), imgOf(item), fallbackImg, decorate(inner, item)?, caption(el, item, href) } */
    function mountVisionCarousel(opts) {
      const { wrap, captionEl, items, preset: P } = opts;
      const n = items.length;

      wrap.innerHTML = '';
      const scaler = document.createElement('div'); scaler.className = 'rc-scaler';
      const stage = document.createElement('div'); stage.className = 'rc-stage';
      const group = document.createElement('div'); group.className = 'rc-group';
      stage.appendChild(group); scaler.appendChild(stage); wrap.appendChild(scaler);

      const cards = items.map((item, i) => {
        const href = opts.hrefOf(item);
        const a = document.createElement('a');
        a.className = 'rc-card';
        a.href = href;
        if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
        a.setAttribute('aria-label', item.title || '');
        a.style.cssText = `width:${opts.cardW}px;height:${opts.cardH}px;margin-left:${-opts.cardW / 2}px;margin-top:${-opts.cardH / 2}px`;
        const inner = document.createElement('div');
        inner.className = 'rc-card-inner';
        inner.style.setProperty('--rc-delay', Math.round(i * 450 / n) + 'ms');
        const img = document.createElement('img');
        img.src = opts.imgOf(item);
        img.alt = item.title || '';
        img.draggable = false;
        img.onerror = () => { img.onerror = null; img.src = opts.fallbackImg; };
        inner.appendChild(img);
        if (opts.decorate) opts.decorate(inner, item);
        a.appendChild(inner); group.appendChild(a);
        return a;
      });

      const pointOnPath = rcBuildPath(P.vertices, [RC_COMP.width / 2, RC_COMP.height / 2]);

      // Frame the visible ring; on phones zoom in and let the ring's far sides crop.
      function fit() {
        const w = wrap.clientWidth, h = wrap.clientHeight, F = P.frame;
        const s = Math.min(h / F.h, w / (w < 600 ? F.wNarrow : F.w));
        scaler.style.transform = `scale(${s}) translate(${-F.cx}px, ${-F.cy}px)`;
      }
      fit();
      new ResizeObserver(fit).observe(wrap);

      let u = 0, introStart = null, last = null, hovering = false, visible = false, dragging = null, frontIdx = -1;

      function showCaption(i) {
        if (i === frontIdx) return;
        frontIdx = i;
        cards.forEach((c, k) => c.classList.toggle('is-front', k === i));
        captionEl.innerHTML = '';
        opts.caption(captionEl, items[i], cards[i]);
      }

      function render() {
        let intro = P.intro;
        if (introStart !== null) {
          const k = Math.min(1, (performance.now() - introStart) / 1600);
          intro = P.intro * (1 - Math.pow(1 - k, 4));
        }
        const poses = rcPoses(P.ctl, pointOnPath, n, u + intro - P.intro);
        let best = 0;
        poses.forEach((p, i) => {
          if (p.z < poses[best].z) best = i;
          cards[i].style.transform = `translate3d(${p.x.toFixed(2)}px,${p.y.toFixed(2)}px,${(-p.z).toFixed(2)}px) rotateY(${p.rotY.toFixed(3)}deg) rotateX(${p.rotX.toFixed(3)}deg) scale(${p.scale.toFixed(5)})`;
        });
        showCaption(best);
      }

      function tick(now) {
        const dt = last === null ? 0 : Math.min(0.1, (now - last) / 1000);
        last = now;
        if (!hovering && !dragging) u += P.speed * dt;  // always auto-rotate, even with OS "reduce motion" on
        render();
        if (visible) requestAnimationFrame(tick); else last = null;
      }

      new IntersectionObserver(([entry]) => {
        const was = visible;
        visible = entry.isIntersecting;
        if (visible && introStart === null) { introStart = performance.now(); wrap.classList.add('is-in'); }
        if (visible && !was) requestAnimationFrame(tick);
      }, { threshold: 0.15 }).observe(wrap);
      render();

      // Hover pauses; drag spins the ring (a short tap still follows the card's link).
      wrap.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') hovering = true; });
      wrap.addEventListener('pointerleave', () => { hovering = false; });
      wrap.addEventListener('pointerdown', (e) => {
        dragging = { x: e.clientX, u, moved: false, id: e.pointerId };
      });
      window.addEventListener('pointermove', (e) => {
        if (!dragging || e.pointerId !== dragging.id) return;
        const dx = e.clientX - dragging.x;
        if (Math.abs(dx) > 6 && !dragging.moved) { dragging.moved = true; wrap.classList.add('is-dragging'); }
        if (dragging.moved) { u = dragging.u - dx / wrap.clientWidth * 0.6; render(); }
      });
      let dragEndedAt = 0;
      wrap.addEventListener('click', (ev) => {
        if (performance.now() - dragEndedAt < 300) { ev.preventDefault(); ev.stopPropagation(); }
      }, true);
      const endDrag = () => {
        if (!dragging) return;
        if (dragging.moved) dragEndedAt = performance.now();
        dragging = null;
        wrap.classList.remove('is-dragging');
      };
      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);
    }

    function rcCaptionLink(href, text) {
      const a = document.createElement('a');
      a.href = href; a.textContent = text;
      if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
      return a;
    }

    async function renderLatestRelease() {
      const wrap = document.getElementById('releaseCarousel');
      let items;
      try {
        const rows = await BLM48Data.fetchSheet('Discography');
        items = rows
          .map(r => ({ ...r, _date: BLM48Data.fmtDate(r.date) }))
          .sort((a, b) => b._date.time - a._date.time)
          .slice(0, 7);
      } catch (err) {
        rcSetStatus(wrap, 'Unable to load releases.');
        return;
      }
      if (!items.length) { rcSetStatus(wrap, 'No releases yet.'); return; }

      // Original rig spaced 12 cards at 1500px; shrink covers as the ring fills up.
      const size = Math.round(Math.max(760, Math.min(1500, 1500 * Math.sqrt(12 / items.length))));
      mountVisionCarousel({
        wrap, items, preset: RC_PRESETS.release,
        captionEl: document.getElementById('releaseCaption'),
        cardW: size, cardH: size,
        hrefOf: item => item.link || 'discography.html',
        imgOf: item => BLM48Data.driveImg(item.coverImage),
        fallbackImg: 'https://via.placeholder.com/600x600?text=BLM48',
        caption(el, item, card) {
          const t = document.createElement('div'); t.className = 'release-title';
          t.appendChild(rcCaptionLink(card.href, item.title || ''));
          const d = document.createElement('div'); d.className = 'release-date'; d.textContent = item._date.full;
          el.append(t, d);
        },
      });
    }

    renderHeroBanner();
    renderMovies();
    renderLinkBanners();
    renderChampOfMonth();
    renderLatestRelease();
  </script>

</body>
</html>
