<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official Home</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">
  <link href="https://fonts.googleapis.com/css?family=Comfortaa:300,400" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); color: var(--blm-ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* --- HERO BANNER (big slide on top, thumbnail strip looping below) --- */
    .hero-banner { max-width: 1300px; width: 92%; margin: 28px auto 0; }
    .hero-banner-main {
      position: relative; width: 100%;
      aspect-ratio: 1445 / 820;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--blm-paper-soft);
      border: 1px solid var(--blm-line);
    }
    .hero-swiper, .hero-swiper .swiper-slide { width: 100%; height: 100%; }
    .hero-slide-link { display: block; width: 100%; height: 100%; }
    .hero-slide-link img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-slide-loading { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: var(--blm-ink-faint); font-weight: 600; }
    .hero-slide-caption {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 30px clamp(20px, 4vw, 44px) 22px;
      background: linear-gradient(0deg, rgba(59,47,38,0.55) 0%, rgba(59,47,38,0) 100%);
      color: #fff;
    }
    .hero-slide-caption-title { font-family: var(--font-display); font-size: clamp(18px, 2.6vw, 28px); font-weight: 700; }
    .hero-slide-caption-sub { font-size: 12.5px; font-weight: 600; opacity: 0.85; margin-top: 4px; }

    .hero-nav-prev, .hero-nav-next {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.85); border: 1px solid var(--blm-line);
      color: var(--blm-ink); display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 6; transition: background 0.2s, color 0.2s;
    }
    .hero-nav-prev:hover, .hero-nav-next:hover { background: var(--blm-gold); color: var(--blm-on-gold); }
    .hero-nav-prev { left: 16px; } .hero-nav-next { right: 16px; }
    .hero-nav-prev.swiper-button-disabled, .hero-nav-next.swiper-button-disabled { opacity: 0.35; cursor: default; }

    .hero-fraction {
      position: absolute !important; right: 20px; top: 18px; left: auto !important; bottom: auto !important; width: auto !important; z-index: 6;
      display: flex; align-items: baseline; gap: 3px;
      font-family: var(--font-display); font-weight: 700; color: #fff; font-size: 13px;
      background: rgba(59,47,38,0.45); padding: 5px 12px; border-radius: var(--radius-pill);
    }
    .hero-fraction .swiper-pagination-current { font-size: 20px; }
    .hero-fraction .swiper-pagination-total { opacity: 0.7; }

    .hero-thumbs { margin-top: 14px; }
    .hero-thumbs .swiper-slide {
      width: clamp(88px, 12vw, 150px); aspect-ratio: 16/9;
      border-radius: var(--radius-md); overflow: hidden; cursor: pointer;
      opacity: 0.5; border: 2px solid transparent; transition: opacity 0.25s, border-color 0.25s;
    }
    .hero-thumbs .swiper-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-thumbs .swiper-slide:hover { opacity: 0.8; }
    .hero-thumbs .swiper-slide-thumb-active { opacity: 1; border-color: var(--blm-gold); }

    /* --- BIRTHDAY BANNER --- */
    .birthday-banner {
      max-width: 1300px; width: 92%; margin: 28px auto 48px;
      border: 3px double var(--blm-gold-deep);
      border-radius: var(--radius-lg);
      padding: 18px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
      background: var(--blm-gold-pale);
    }
    .birthday-banner-label {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-display); font-weight: 800; font-size: 15px;
      color: var(--blm-gold-deep); letter-spacing: 0.3px; white-space: nowrap;
    }
    .birthday-chips { display: flex; gap: 10px; flex-wrap: wrap; }
    .birthday-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--blm-gold); color: var(--blm-on-gold); text-decoration: none;
      padding: 5px 16px 5px 5px; border-radius: var(--radius-pill);
      font-weight: 700; font-size: 13px;
      transition: transform 0.2s, background 0.2s;
    }
    .birthday-chip:hover { background: var(--blm-gold-deep); transform: translateY(-2px); }
    .birthday-chip img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.7); }
    .birthday-empty { font-size: 13.5px; font-weight: 600; color: var(--blm-gold-deep); opacity: 0.75; }
    @media (max-width: 640px) { .birthday-banner { flex-direction: column; align-items: flex-start; } }

    .sec-head.no-underline { border-bottom: none; padding-bottom: 0; }

    /* --- NEWS & SCHEDULE --- */
    .content-box-section { max-width: 1300px; width: 92%; margin: 0 auto 76px; display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
    @media (max-width: 900px) { .content-box-section { grid-template-columns: 1fr; gap: 56px; } }
    .data-list { display: flex; flex-direction: column; margin-bottom: 20px; }
    .data-row { display: flex; align-items: center; gap: 18px; text-decoration: none; color: inherit; padding: 16px 0; border-bottom: 1px solid var(--blm-line); }
    .data-row:first-child { padding-top: 0; }
    .data-row:hover { background: var(--blm-paper-soft); border-radius: var(--radius-md); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
    .data-row:hover .data-title { color: var(--blm-pink-deep); }
    @media (max-width: 600px) { .data-row { flex-direction: column; align-items: flex-start; gap: 8px; } }
    .data-date-group { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 96px; flex-shrink: 0; }
    .data-date { font-size: 12px; color: var(--blm-ink-faint); font-weight: 600; }
    .data-title { font-size: 14.5px; font-weight: 600; color: var(--blm-ink); line-height: 1.4; transition: color 0.2s; }

    /* --- CHAMP OF THE MONTH --- */
    .champ-section { max-width: 1300px; width: 92%; margin: 0 auto 100px; }

    /* --- VIDEO SECTION --- */
    .video-section { max-width: 1300px; width: 92%; margin: 0 auto 90px; position: relative; }
    .video-swiper-container { position: relative; width: 100%; height: auto; }
    .video-swiper { width: 100%; height: auto !important; overflow: hidden; }
    .video-swiper .swiper-wrapper { height: auto !important; align-items: flex-start !important; }
    .video-swiper .swiper-slide { height: auto !important; }
    .video-item { display: block; width: 100%; text-decoration: none; color: inherit; }
    .video-thumb-box { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: var(--blm-paper-soft); border: 1px solid var(--blm-line); border-radius: var(--radius-md); }
    .video-thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .video-item:hover .video-thumb-box img { transform: scale(1.05); }
    .video-cap { padding-top: 12px; }
    .video-cap-title { font-size: 13.5px; font-weight: 700; color: var(--blm-ink); line-height: 1.4; }
    .video-cap-date { font-size: 11.5px; color: var(--blm-ink-faint); font-weight: 600; margin-top: 4px; }

    .video-nav-prev, .video-nav-next {
      color: var(--blm-ink) !important;
      background: var(--blm-paper);
      border: 1px solid var(--blm-line);
      width: 40px !important; height: 40px !important; border-radius: 50%;
      transition: background 0.2s ease, color 0.2s ease;
      top: 36% !important; transform: translateY(-50%) !important; margin-top: 0 !important;
    }
    .video-nav-prev:hover, .video-nav-next:hover { background: var(--blm-pink); border-color: var(--blm-pink); color: #fff !important; }
    .video-nav-prev::after, .video-nav-next::after { font-size: 15px !important; font-weight: bold; }
    .video-nav-prev { left: -18px !important; }
    .video-nav-next { right: -18px !important; }
    @media (max-width: 768px) { .video-nav-prev { left: -8px !important; } .video-nav-next { right: -8px !important; } }

    /* --- LATEST RELEASE (Discography) --- */
    .release-section { max-width: 1300px; width: 92%; margin: 0 auto 90px; }
    .release-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    @media (max-width: 768px) { .release-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .release-grid { grid-template-columns: 1fr; } }
    .release-card { display: block; text-decoration: none; color: inherit; }
    .release-cover { width: 100%; aspect-ratio: 1/1; overflow: hidden; border-radius: var(--radius-md); border: 1px solid var(--blm-line); background: var(--blm-paper-soft); margin-bottom: 12px; }
    .release-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
    .release-card:hover .release-cover img { transform: scale(1.04); }
    .release-title { font-size: 14px; font-weight: 700; color: var(--blm-ink); line-height: 1.4; margin-bottom: 4px; transition: color 0.2s; }
    .release-card:hover .release-title { color: var(--blm-pink-deep); }
    .release-date { font-size: 12px; color: var(--blm-ink-faint); font-weight: 600; }
    .release-more { display: flex; justify-content: center; margin-top: 32px; }

    /* --- GROUP NETWORK --- */
    .group-band { background: var(--blm-paper-soft); border-top: 1px solid var(--blm-line); border-bottom: 1px solid var(--blm-line); padding: 56px 0; }
    .group-inner { max-width: 1300px; width: 92%; margin: 0 auto; text-align: center; }
    .logo-grid {
      display: flex; flex-wrap: nowrap; align-items: center; justify-content: flex-start;
      gap: clamp(10px, 2vw, 28px);
      overflow-x: auto; padding: 4px 2px 10px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 1180px) { .logo-grid { justify-content: center; } }
    .logo-grid::-webkit-scrollbar { height: 5px; }
    .logo-grid::-webkit-scrollbar-thumb { background: var(--blm-line); }
    .logo-grid a { flex: 0 0 auto; scroll-snap-align: start; display: flex; justify-content: center; opacity: 0.85; transition: opacity 0.2s, transform 0.2s; }
    .logo-grid a:hover { opacity: 1; transform: translateY(-3px); }
    .logo-grid img { width: clamp(42px, 5.2vw, 70px); height: auto; flex-shrink: 0; }

    /* --- LINK BANNERS --- */
    .link-banners { max-width: 1300px; width: 92%; margin: 56px auto 90px; }
    .link-banners-grid { display: flex; flex-wrap: wrap; gap: 16px; }
    .link-banner-tile {
      flex: 1 1 260px;
      aspect-ratio: 2048 / 546;
      display: block;
      overflow: hidden;
      border-radius: var(--radius-md);
      border: 1px solid var(--blm-line);
      background: var(--blm-paper-soft);
    }
    .link-banner-tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
    .link-banner-tile:hover img { transform: scale(1.04); }
  </style>
</head>

  <!-- Birthday This Month -->
  <script>
    let allMembersData = [];

    function renderBirthdayMonth() {
      const today = new Date();
      const listEl = document.getElementById('birthdayList');
      if (!listEl) return;

      const celebrants = allMembersData
        .map(m => {
          const bday = m.birthday ? new Date(m.birthday) : null;
          return bday && !isNaN(bday) ? { member: m, bday } : null;
        })
        .filter(entry => entry && entry.bday.getMonth() === today.getMonth())
        .sort((a, b) => a.bday.getDate() - b.bday.getDate());

      if (!celebrants.length) {
        listEl.innerHTML = `<span class="birthday-empty">No birthdays this month</span>`;
        return;
      }

      listEl.innerHTML = celebrants.map(({ member, bday }) => `
        <a href="profile.html" class="birthday-chip">
          <img src="${BLM48Data.driveImg(member.image, 'https://via.placeholder.com/100x100?text=BLM48')}" alt="${member.name}" onerror="this.src='https://via.placeholder.com/100x100?text=BLM48'">
          <span>${member.name} · ${bday.toLocaleDateString('en-US', { day: 'numeric', month: 'short' })}</span>
        </a>
      `).join('');
    }

    async function initMembersData() {
      try {
        allMembersData = await BLM48Data.fetchMembers();
      } catch (err) {
        allMembersData = [];
      }
      renderBirthdayMonth();
    }

    initMembersData();
  </script>

  <!-- News & Schedule previews -->
  <script>
    async function renderHomeList(containerId, sheetName, emptyMsg) {
      const listEl = document.getElementById(containerId);
      try {
        const rows = await BLM48Data.fetchSheet(sheetName);
        const items = rows
          .map(r => ({ ...r, _date: BLM48Data.fmtDate(r.date) }))
          .sort((a, b) => b._date.time - a._date.time)
          .slice(0, 7);

        if (!items.length) {
          listEl.innerHTML = `<div class="data-row" style="border-bottom:none;"><div class="data-title" style="color:var(--blm-ink-faint);">${emptyMsg}</div></div>`;
          return;
        }

        listEl.innerHTML = items.map(item => `
          <a href="${item.link || '#'}" target="_blank" rel="noopener" class="data-row">
            <div class="data-date-group"><span class="kicker ${BLM48Data.tagClass(item.tag)}">${item.tag || ''}</span><span class="data-date">${item._date.full}</span></div>
            <div class="data-title">${item.title || ''}</div>
          </a>
        `).join('');
      } catch (err) {
        listEl.innerHTML = `<div class="data-row" style="border-bottom:none;"><div class="data-title" style="color:var(--blm-ink-faint);">${emptyMsg}</div></div>`;
      }
    }
    renderHomeList('homeNewsList', 'News', 'No news yet.');
    renderHomeList('homeScheduleList', 'Schedule', 'No schedule yet.');

    async function renderMovies() {
      const wrapEl = document.getElementById('videoSwiperWrapper');
      try {
        const rows = await BLM48Data.fetchSheet('Movie');
        const items = rows
          .map(r => ({ ...r, _date: BLM48Data.fmtDate(r.date) }))
          .sort((a, b) => b._date.time - a._date.time);

        if (!items.length) {
          wrapEl.innerHTML = '<div class="swiper-slide"><div class="video-cap-title" style="color:var(--blm-ink-faint);padding:20px 0;">No videos yet.</div></div>';
          return;
        }

        wrapEl.innerHTML = items.map(item => `
          <div class="swiper-slide">
            <a href="${item.link || '#'}" target="_blank" rel="noopener" class="video-item">
              <div class="video-thumb-box"><img src="${BLM48Data.driveImg(item.thumbnail)}" alt="${item.title || ''}" onerror="this.src='https://via.placeholder.com/640x360?text=BLM48'"></div>
              <div class="video-cap">
                <div class="video-cap-title">${item.title || ''}</div>
                <div class="video-cap-date">${item._date.full}${item.note ? ' — ' + item.note : ''}</div>
              </div>
            </a>
          </div>
        `).join('');
      } catch (err) {
        wrapEl.innerHTML = '<div class="swiper-slide"><div class="video-cap-title" style="color:var(--blm-ink-faint);padding:20px 0;">Unable to load videos.</div></div>';
      } finally {
        new Swiper('.video-swiper', {
          slidesPerView: 3.2,
          spaceBetween: 22,
          grabCursor: true,
          loop: false,
          navigation: { nextEl: '.video-nav-next', prevEl: '.video-nav-prev' },
          breakpoints: {
            320: { slidesPerView: 1.15, spaceBetween: 14 },
            640: { slidesPerView: 2.1, spaceBetween: 16 },
            1024: { slidesPerView: 3.2, spaceBetween: 22 }
          }
        });
      }
    }

    async function renderHeroBanner() {
      const mainWrap = document.getElementById('heroSwiperWrapper');
      const thumbsWrap = document.getElementById('heroThumbsWrapper');
      const thumbsEl = document.getElementById('heroThumbs');

      let rows = [];
      try {
        rows = await BLM48Data.fetchSheet('HeroBanner');
      } catch (err) {
        rows = [];
      }

      if (!rows.length) {
        mainWrap.innerHTML = '<div class="swiper-slide"><div class="hero-slide-loading">No banners yet.</div></div>';
        thumbsEl.style.display = 'none';
        document.getElementById('heroPrev').style.display = 'none';
        document.getElementById('heroNext').style.display = 'none';
        document.getElementById('heroFraction').style.display = 'none';
        new Swiper('.hero-swiper', { loop: false });
        return;
      }

      mainWrap.innerHTML = rows.map(item => `
        <div class="swiper-slide">
          <a href="${item.link || '#'}" ${item.link ? 'target="_blank" rel="noopener"' : ''} class="hero-slide-link">
            <img src="${BLM48Data.driveImg(item.image || item.thumbnail)}" alt="${item.title || 'BLM48'}" onerror="this.src='https://via.placeholder.com/1600x680?text=BLM48'">
            ${item.title ? `
              <div class="hero-slide-caption">
                <div class="hero-slide-caption-title">${item.title}</div>
                ${item.subtitle ? `<div class="hero-slide-caption-sub">${item.subtitle}</div>` : ''}
              </div>
            ` : ''}
          </a>
        </div>
      `).join('');

      thumbsWrap.innerHTML = rows.map(item => `
        <div class="swiper-slide">
          <img src="${BLM48Data.driveImg(item.image || item.thumbnail)}" alt="${item.title || 'BLM48'}" onerror="this.src='https://via.placeholder.com/300x170?text=BLM48'">
        </div>
      `).join('');

      const heroThumbsSwiper = new Swiper('.hero-thumbs', {
        slidesPerView: 'auto',
        spaceBetween: 12,
        watchSlidesProgress: true,
        loop: rows.length > 2
      });

      new Swiper('.hero-swiper', {
        loop: rows.length > 1,
        autoplay: rows.length > 1 ? { delay: 4500, disableOnInteraction: false } : false,
        navigation: { nextEl: '#heroNext', prevEl: '#heroPrev' },
        pagination: { el: '#heroFraction', type: 'fraction' },
        thumbs: { swiper: heroThumbsSwiper },
        effect: 'fade',
        fadeEffect: { crossFade: true }
      });
    }

    async function renderLinkBanners() {
      const sectionEl = document.getElementById('linkBanners');
      const gridEl = document.getElementById('linkBannersGrid');
      let rows = [];
      try {
        rows = await BLM48Data.fetchSheet('LinkBanners');
      } catch (err) {
        rows = [];
      }

      if (!rows.length) {
        sectionEl.style.display = 'none';
        return;
      }

      gridEl.innerHTML = rows.map(item => `
        <a href="${item.link || '#'}" ${item.link ? 'target="_blank" rel="noopener"' : ''} class="link-banner-tile">
          <img src="${BLM48Data.driveImg(item.image || item.thumbnail)}" alt="${item.title || 'BLM48'}" loading="lazy" onerror="this.src='https://via.placeholder.com/2048x546?text=BLM48'">
        </a>
      `).join('');
    }

    // Same public anon key the Membership app (blm48-membership.vercel.app) ships client-side.
    // Every table behind it is RLS-locked with zero policies - the anon key can only call
    // read-only RPCs like this one, never touch a table directly.
    const MEMBERSHIP_SUPABASE_URL = 'https://rqhwzbrcgnpxtuaeoxml.supabase.co';
    const MEMBERSHIP_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxaHd6YnJjZ25weHR1YWVveG1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjczNjAsImV4cCI6MjEwMDgwMzM2MH0.J0iiUikxLoJKZ5SF9KSz86yf2LU89z8NdPb9rEB89Gw';

    async function renderChampOfMonth() {
      const sectionEl = document.getElementById('champSection');
      const gridEl = document.getElementById('champGrid');
      try {
        const res = await fetch(MEMBERSHIP_SUPABASE_URL + '/rest/v1/rpc/get_champ_of_the_month', {
          method: 'POST',
          headers: {
            'apikey': MEMBERSHIP_SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + MEMBERSHIP_SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          },
          body: '{}'
        });
        const json = await res.json();
        const champs = (json && json.status === 'success' && Array.isArray(json.data))
          ? json.data.filter(c => (c.groupName || 'BLM48') === 'BLM48').slice(0, 4)
          : [];

        if (!champs.length) {
          sectionEl.style.display = 'none';
          return;
        }

        gridEl.innerHTML = champs.map(champ => {
          const cookieCount = Number(champ.totalCookie || 0).toLocaleString();
          const href = champ.postId
            ? `https://blm48-membership.vercel.app/postdetail?id=${encodeURIComponent(champ.postId)}`
            : 'https://blm48-membership.vercel.app/champranking';
          return `
            <a href="${href}" target="_blank" rel="noopener" class="champ-post-card">
              <div class="champ-post-photo">
                <img src="${BLM48Data.driveImg(champ.postImage || champ.profileImage)}" alt="${champ.name || ''}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x500?text=BLM48'">
                <div class="champ-post-cookie"><i class="fa-solid fa-cookie"></i> ${cookieCount} Cookies</div>
              </div>
              <div class="champ-post-foot">
                <div class="champ-post-avatar"><img src="${BLM48Data.driveImg(champ.profileImage)}" alt="" onerror="this.src='https://via.placeholder.com/68x68?text=BLM48'"></div>
                <div class="champ-post-meta">
                  <span class="champ-post-name">${champ.name || ''}</span>
                  <span class="champ-post-when">${champ.monthYear || ''}</span>
                </div>
              </div>
            </a>
          `;
        }).join('');
      } catch (err) {
        sectionEl.style.display = 'none';
      }
    }

    async function renderLatestRelease() {
      const gridEl = document.getElementById('releaseGrid');
      try {
        const rows = await BLM48Data.fetchSheet('Discography');
        const items = rows
          .map(r => ({ ...r, _date: BLM48Data.fmtDate(r.date) }))
          .sort((a, b) => b._date.time - a._date.time)
          .slice(0, 3);

        if (!items.length) {
          gridEl.innerHTML = '<p style="color:var(--blm-ink-faint);font-weight:600;">No releases yet.</p>';
          return;
        }

        gridEl.innerHTML = items.map(item => `
          <a href="${item.link || '#'}" target="_blank" rel="noopener" class="release-card">
            <div class="release-cover"><img src="${BLM48Data.driveImg(item.coverImage)}" alt="${item.title || ''}" loading="lazy" onerror="this.src='https://via.placeholder.com/600x600?text=BLM48'"></div>
            <div class="release-title">${item.title || ''}</div>
            <div class="release-date">${item._date.full}</div>
          </a>
        `).join('');
      } catch (err) {
        gridEl.innerHTML = '<p style="color:var(--blm-ink-faint);font-weight:600;">Unable to load releases.</p>';
      }
    }

    renderHeroBanner();
    renderMovies();
    renderLinkBanners();
    renderChampOfMonth();
    renderLatestRelease();
  </script>

</body>
