<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official - Cafe</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css?family=Comfortaa:300,400,700" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); color: var(--blm-ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    :root {
      --cafe-green: #1f9e6e;
      --cafe-green-pale: #e3f5ec;
      --cafe-stage-h: max(480px, calc(100svh - var(--header-h) - var(--topbar-h)));
    }

    /* --- 3D stage: the whole storefront fills the first screen --- */
    .cafe-stage {
      position: relative; height: var(--cafe-stage-h); overflow: hidden;
      background: linear-gradient(180deg, #fde9f1 0%, #fff6dc 100%);
      touch-action: none;
    }
    .cafe-stage canvas { display: block; width: 100%; height: 100%; outline: none; }
    .cafe-stage.is-hover canvas { cursor: pointer; }

    .cafe-loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      color: var(--cafe-green); font-weight: 700; letter-spacing: 0.08em; font-size: 13px;
      background: linear-gradient(180deg, #fde9f1 0%, #fff6dc 100%); transition: opacity 0.6s;
    }
    .cafe-loading i { font-size: 26px; }
    .cafe-loading.is-done { opacity: 0; pointer-events: none; }

    .cafe-hud {
      position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 2;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      pointer-events: none;
    }
    .cafe-hud > * { pointer-events: auto; }
    .cafe-hint {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(6px);
      font-size: 12px; color: var(--blm-ink-soft); box-shadow: 0 6px 16px rgba(59, 47, 38, 0.08);
    }
    .cafe-hint i { color: var(--cafe-green); }
    .cafe-hud-actions { display: flex; gap: 8px; }
    .cafe-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; border: none;
      font-family: inherit; font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; text-decoration: none;
      background: rgba(255, 255, 255, 0.92); color: var(--blm-ink); box-shadow: 0 6px 16px rgba(59, 47, 38, 0.1);
      transition: transform 0.2s, background 0.2s;
    }
    .cafe-btn:hover { transform: translateY(-2px); background: #fff; }
    .cafe-btn-green { background: var(--cafe-green); color: #fff; }
    .cafe-btn-green:hover { background: #18865c; }

    /* --- Drink card that pops up when a cup / menu panel is tapped --- */
    .cafe-pop {
      position: absolute; top: 16px; right: 16px; z-index: 3; width: min(300px, calc(100% - 32px));
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px); border-radius: 22px; overflow: hidden;
      box-shadow: 0 18px 40px rgba(59, 47, 38, 0.18);
      transform: translateY(-8px) scale(0.98); opacity: 0; pointer-events: none;
      transition: opacity 0.25s, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cafe-pop.is-open { opacity: 1; transform: none; pointer-events: auto; }
    .cafe-pop-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--blm-paper-soft); }
    .cafe-pop-body { padding: 16px 18px 18px; }
    .cafe-pop-tag { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--cafe-green); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
    .cafe-pop-name { margin-top: 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: 0.04em; }
    .cafe-pop-sub { font-size: 12px; color: var(--blm-ink-faint); margin-top: 2px; }
    .cafe-pop-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
    .cafe-pop-price { font-size: 14px; font-weight: 700; color: var(--blm-ink-soft); }
    .cafe-pop-price i { color: var(--blm-gold-deep); margin-right: 4px; }
    .cafe-pop-close {
      position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
      background: rgba(255, 255, 255, 0.92); color: var(--blm-ink); font-size: 14px; box-shadow: 0 4px 10px rgba(59, 47, 38, 0.12);
    }

    .cafe-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--blm-ink-soft); }

    @media (max-width: 640px) {
      :root { --cafe-stage-h: max(440px, 70svh); }
      .cafe-hint span { display: none; }
      .cafe-pop { top: auto; bottom: 74px; right: 16px; }
      .cafe-pop-img { aspect-ratio: 16 / 9; }
    }

    /* --- Plain menu list under the stage (same items, readable without 3D) --- */
    .cafe-menu { width: min(1200px, 100% - 32px); margin: clamp(40px, 6vw, 72px) auto clamp(50px, 6vw, 80px); }
    .cafe-menu-head { text-align: center; margin-bottom: clamp(24px, 4vw, 40px); }
    .cafe-menu-kicker { font-size: 12px; letter-spacing: 0.24em; color: var(--cafe-green); font-weight: 700; }
    .cafe-menu-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 3.4vw, 36px); letter-spacing: 0.1em; margin-top: 6px; }
    .cafe-menu-note { margin-top: 10px; font-size: 13px; color: var(--blm-ink-soft); }
    .cafe-menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(12px, 2vw, 24px); }
    @media (max-width: 900px) { .cafe-menu-grid { grid-template-columns: repeat(2, 1fr); } }
    .cafe-item {
      display: flex; flex-direction: column; border-radius: 20px; overflow: hidden; background: #fff; text-decoration: none; color: inherit;
      border: 1px solid var(--blm-line); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; font-family: inherit; text-align: left;
    }
    .cafe-item:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(59, 47, 38, 0.1); }
    .cafe-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--blm-paper-soft); }
    .cafe-item-body { padding: 14px 16px 16px; border-top: 4px solid var(--item-color, var(--cafe-green)); }
    .cafe-item-name { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; }
    .cafe-item-sub { font-size: 12px; color: var(--blm-ink-faint); margin-top: 2px; }
    .cafe-item-price { margin-top: 8px; font-size: 13px; color: var(--blm-ink-soft); }
    .cafe-item-price i { color: var(--blm-gold-deep); margin-right: 4px; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>

  <main>
    <section class="cafe-stage" id="cafeStage" aria-label="BLM48 Cafe The Campus - 3D storefront">
      <div class="cafe-loading" id="cafeLoading"><i class="fas fa-mug-hot fa-bounce"></i><span>OPENING THE CAFE...</span></div>

      <div class="cafe-pop" id="cafePop" role="dialog" aria-live="polite" aria-label="Drink details">
        <button type="button" class="cafe-pop-close" id="cafePopClose" aria-label="Close"><i class="fas fa-xmark"></i></button>
        <img class="cafe-pop-img" id="cafePopImg" alt="">
        <div class="cafe-pop-body">
          <span class="cafe-pop-tag">BLM48 Cafe</span>
          <div class="cafe-pop-name" id="cafePopName"></div>
          <div class="cafe-pop-sub" id="cafePopSub"></div>
          <div class="cafe-pop-row">
            <div class="cafe-pop-price" id="cafePopPrice"></div>
            <a class="cafe-btn cafe-btn-green" href="https://blm48-membership.vercel.app/shop#section-cafe" target="_blank" rel="noopener">สั่งในแอป ›</a>
          </div>
        </div>
      </div>

      <div class="cafe-hud">
        <div class="cafe-hint"><i class="fas fa-hand-pointer" aria-hidden="true"></i><span>ลากเพื่อหมุน · เลื่อนเพื่อซูม · แตะแก้วหรือเมนูเพื่อดูรายละเอียด</span></div>
        <div class="cafe-hud-actions">
          <button type="button" class="cafe-btn" id="cafeReset"><i class="fas fa-rotate-left" aria-hidden="true"></i> Reset</button>
          <a class="cafe-btn cafe-btn-green" href="shop#section-cafe"><i class="fas fa-bag-shopping" aria-hidden="true"></i> Shop</a>
        </div>
      </div>
    </section>

    <section class="cafe-menu" aria-labelledby="cafeMenuTitle">
      <div class="cafe-menu-head">
        <div class="cafe-menu-kicker">THE CAMPUS · ショップとカフェ</div>
        <h1 class="cafe-menu-title" id="cafeMenuTitle">BLM48 CAFE MENU</h1>
        <p class="cafe-menu-note">สั่งเครื่องดื่มได้ทางแอป BLM48 Membership</p>
      </div>
      <div class="cafe-menu-grid" id="cafeMenuGrid"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script>
    // Same fixed drink catalog as the Cafe section on shop.html / the Membership app.
    // `color` tints the menu board panel; `cup` is the 800x1000 cup photo the Membership app
    // builds its realistic 3D cup from (the same model is used on the counter here).
    window.CAFE_MENU = [
      { name: 'Suiito Matcha', sub: 'いちごミニパフェ', price: 5, color: '#5f9b4f', drink: '#9cc96b', image: 'https://lh3.googleusercontent.com/d/1hc_AQblGKyamIOmspWseUcnY2gwW9dyg=s1000', cup: 'https://lh3.googleusercontent.com/d/1thW4VJVyFLsgMQNI0wAFaIC7gsqnATeM=s1000' },
      { name: 'Pinku Milk', sub: 'ピンクミルク', price: 5, color: '#f19bbd', drink: '#f7b9cf', image: 'https://lh3.googleusercontent.com/d/1_KC4glssnDILv1GP7BtUnjT1-uP1omlB=s1000', cup: 'https://lh3.googleusercontent.com/d/1b_wl3lpi_QPd9-9nXBofw5mBL-jUu0Hn=s1000' },
      { name: 'Koi Cocoa', sub: '濃いココア', price: 5, color: '#8b5a3c', drink: '#9a6646', image: 'https://lh3.googleusercontent.com/d/1ERV8sH_M0fv3dIFqfGGyf23JTTK3z0F-=s1000', cup: 'https://lh3.googleusercontent.com/d/1fHP-8N6VcRalynHDEZZWrjWhd7zYyHfF=s1000' },
      { name: 'Thai Miruku Tea', sub: 'タイミルクティー', price: 5, color: '#f39a3a', drink: '#f2a55a', image: 'https://lh3.googleusercontent.com/d/11kPILdW6tOh5xZZ-Kl6JpAUsJeYWrlXE=s1000', cup: 'https://lh3.googleusercontent.com/d/1HBOXvqFCL_-wrxbZlaEf15JvrGDUurhf=s1000' }
    ];

    // Release covers hung on the pink wall beside the counter.
    window.CAFE_POSTERS = [
      'https://lh3.googleusercontent.com/d/1E1Usx32Bov92lz6_1BbfMqUcA7YwOivz=s1000',
      'https://lh3.googleusercontent.com/d/1qXtFoBEr2DdfPDZGiF53ZW_PNytLPBSw=s1000',
      'https://lh3.googleusercontent.com/d/1eBeiupo0dGwXd3ramURgVG57LNYtGgxu=s1000',
      'https://lh3.googleusercontent.com/d/1f95utx33yfxcFUsr_OlTSt0pZllO-CSi=s1000',
      'https://lh3.googleusercontent.com/d/1OdLLWspqoQ4LI6UAXJ4NOkRotcAvdF6S=s1000',
      'https://lh3.googleusercontent.com/d/1NlFzsvfhexq2-XqMkcbC9QjyX_zdFEv-=s1000'
    ];

    (function cafePopup() {
      const pop = document.getElementById('cafePop');
      const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      window.openCafeItem = function (i) {
        const item = CAFE_MENU[i];
        document.getElementById('cafePopImg').src = item.image;
        document.getElementById('cafePopImg').alt = item.name;
        document.getElementById('cafePopName').textContent = item.name;
        document.getElementById('cafePopSub').textContent = item.sub;
        document.getElementById('cafePopPrice').innerHTML = `<i class="fas fa-coins"></i>${item.price} Token`;
        pop.classList.add('is-open');
      };
      window.closeCafeItem = () => pop.classList.remove('is-open');
      document.getElementById('cafePopClose').addEventListener('click', closeCafeItem);
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCafeItem(); });

      document.getElementById('cafeMenuGrid').innerHTML = CAFE_MENU.map((item, i) => `
        <button type="button" class="cafe-item reveal reveal-${i + 1}" style="--item-color:${item.color}" data-i="${i}">
          <img src="${item.image}" alt="${esc(item.name)}" loading="lazy">
          <div class="cafe-item-body">
            <div class="cafe-item-name">${esc(item.name)}</div>
            <div class="cafe-item-sub">${esc(item.sub)}</div>
            <div class="cafe-item-price"><i class="fas fa-coins"></i>${item.price} Token</div>
          </div>
        </button>
      `).join('');
      document.getElementById('cafeMenuGrid').addEventListener('click', e => {
        const btn = e.target.closest('.cafe-item');
        if (!btn) return;
        document.getElementById('cafeStage').scrollIntoView({ behavior: 'smooth' });
        if (window.focusCafeItem) window.focusCafeItem(+btn.dataset.i);
        else openCafeItem(+btn.dataset.i);
      });
    })();
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { setupCups, realCup, CUP_BOTTOM } from './assets/js/cup-model.js';

    const stage = document.getElementById('cafeStage');
    const loading = document.getElementById('cafeLoading');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    } catch (err) {
      loading.remove();
      stage.insertAdjacentHTML('beforeend', '<div class="cafe-fallback">เบราว์เซอร์นี้ไม่รองรับการแสดงผล 3D — ดูเมนูด้านล่างได้เลย</div>');
      throw err;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.prepend(renderer.domElement);
    renderer.domElement.setAttribute('aria-hidden', 'true');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#fbeef3');
    scene.fog = new THREE.Fog('#fbeef3', 18, 34);
    // Soft studio reflections so chrome and glass read as shiny instead of black.
    const envMap = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    setupCups({ envMap, maxAniso: renderer.capabilities.getMaxAnisotropy() });

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    // Default framing. Portrait screens centre on the counter and stand further back
    // so the sign, menu board and cups all fit across the narrow width.
    function homeView() {
      const narrow = Math.max(0, 1.2 - camera.aspect);
      const x = narrow ? 0.4 : -0.6;
      return { pos: new THREE.Vector3(x, 2.5 + narrow, 9.6 + narrow * 7), target: new THREE.Vector3(x, 2.4, -1) };
    }

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 3.5;
    controls.maxDistance = 18;
    controls.minPolarAngle = Math.PI * 0.28;
    controls.maxPolarAngle = Math.PI * 0.52;
    controls.minAzimuthAngle = -Math.PI * 0.32;
    controls.maxAzimuthAngle = Math.PI * 0.32;

    // ---------- Lights ----------
    scene.add(new THREE.HemisphereLight('#fff8ef', '#f3d9a4', 1.6));
    const sun = new THREE.DirectionalLight('#ffffff', 1.8);
    sun.position.set(4, 9, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 10, bottom: -4, near: 1, far: 30 });
    sun.shadow.bias = -0.0005;
    sun.shadow.radius = 4;
    scene.add(sun);
    const fill = new THREE.DirectionalLight('#ffe3ef', 0.6);
    fill.position.set(-8, 4, 6);
    scene.add(fill);

    // ---------- Helpers ----------
    const maxAniso = renderer.capabilities.getMaxAnisotropy();
    function canvasTexture(w, h, draw, repeat) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      if (repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(repeat[0], repeat[1]); }
      return tex;
    }
    const std = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6, metalness: 0 }, extra));
    function box(w, h, d, mat, x, y, z, opts = {}) {
      const geo = opts.round ? new RoundedBoxGeometry(w, h, d, 3, opts.round) : new THREE.BoxGeometry(w, h, d);
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.castShadow = opts.cast !== false;
      m.receiveShadow = true;
      (opts.parent || scene).add(m);
      return m;
    }

    // Remote picture as a texture, cropped like CSS object-fit: cover for a plane of `aspect` (w/h).
    // Google Drive image links (lh3) throttle (429) when many load at once, so loads are
    // staggered and a failure retries a few times with growing delays before giving up.
    // A counter lifts the loading veil once every picture is in (or has given up).
    const loader = new THREE.TextureLoader();
    loader.setCrossOrigin('anonymous');
    let pending = 0, queued = 0;
    function settle() { if (--pending === 0) loading.classList.add('is-done'); }
    function coverTexture(url, aspect, fallbackColor) {
      const placeholder = canvasTexture(64, 64, (g, w, h) => { g.fillStyle = fallbackColor || '#f4e3ea'; g.fillRect(0, 0, w, h); });
      const mat = new THREE.MeshStandardMaterial({ map: placeholder, roughness: 0.55 });
      const src = url.replace(/=s\d+$/, '=s640');
      pending++;
      const attempt = n => loader.load(n ? src + '?r=' + n : src, tex => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = maxAniso;
        const imgAspect = tex.image.width / tex.image.height;
        if (imgAspect > aspect) { tex.repeat.set(aspect / imgAspect, 1); tex.offset.set((1 - tex.repeat.x) / 2, 0); }
        else { tex.repeat.set(1, imgAspect / aspect); tex.offset.set(0, (1 - tex.repeat.y) / 2); }
        mat.map = tex;
        mat.needsUpdate = true;
        settle();
      }, undefined, () => {
        if (n < 3) setTimeout(() => attempt(n + 1), 1200 * (n + 1) + Math.random() * 1500);
        else settle();
      });
      setTimeout(() => attempt(0), queued++ * 180);
      return mat;
    }

    const pickables = [];

    // ---------- Floor: butter-yellow tiles with the faint crown watermark ----------
    const floorTex = canvasTexture(512, 512, (g, w, h) => {
      g.fillStyle = '#f4cf5d'; g.fillRect(0, 0, w, h);
      const grad = g.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, 'rgba(255,255,255,0.18)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grad; g.fillRect(0, 0, w, h);
      g.strokeStyle = 'rgba(255,248,225,0.9)'; g.lineWidth = 6; g.strokeRect(0, 0, w, h);
      g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 4;
      g.beginPath(); g.arc(w / 2, h / 2, 120, 0, Math.PI * 2); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.6)'; g.textAlign = 'center';
      g.font = 'italic 700 68px Georgia, serif'; g.fillText('BLM', w / 2, h / 2 + 10);
      g.font = '600 26px Georgia, serif'; g.fillText('48', w / 2 + 70, h / 2 + 50);
      g.font = '22px Georgia, serif'; g.fillText('Since 2024', w / 2, h / 2 + 88);
      // little crown
      g.beginPath(); g.moveTo(w / 2 - 40, h / 2 - 50); g.lineTo(w / 2 - 28, h / 2 - 90); g.lineTo(w / 2 - 12, h / 2 - 62);
      g.lineTo(w / 2, h / 2 - 100); g.lineTo(w / 2 + 12, h / 2 - 62); g.lineTo(w / 2 + 28, h / 2 - 90); g.lineTo(w / 2 + 40, h / 2 - 50); g.closePath(); g.fill();
    }, [10, 6]);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 24), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.35, metalness: 0.05 }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, 4);
    floor.receiveShadow = true;
    scene.add(floor);

    // ---------- Kitchen behind the counter ----------
    const KITCHEN_Z = -4.2;
    const tileTex = canvasTexture(256, 256, (g, w, h) => {
      g.fillStyle = '#f7f5f2'; g.fillRect(0, 0, w, h);

    function pick(ev) {
      const r = renderer.domElement.getBoundingClientRect();
      pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(pickables, false)[0];
      return hit ? hit.object.userData.item : -1;
    }
    renderer.domElement.addEventListener('pointermove', ev => {
      if (ev.pointerType !== 'mouse') return;
      hovered = pick(ev);

    });
    renderer.domElement.addEventListener('pointerleave', () => { hovered = -1; stage.classList.remove('is-hover'); });
    renderer.domElement.addEventListener('pointerdown', ev => { downAt = { x: ev.clientX, y: ev.clientY }; });

      if (i >= 0) focusCafeItem(i);

    }
    controls.addEventListener('start', () => { fly = null; });

    };

      selected = -1;

    // ---------- Resize + render loop ----------
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // Narrow screens see the storefront from further back so the whole sign fits.
      camera.fov = camera.aspect < 0.8 ? 62 : camera.aspect < 1.2 ? 52 : 45;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage);
    resize();

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ease = t => 1 - Math.pow(1 - t, 3);
    // Opening shot: drift in from a wider angle.
    const home = homeView();
    camera.position.copy(home.pos);
    controls.target.copy(home.target);
    if (!reduceMotion) {
      camera.position.set(-5.5, 3.6, home.pos.z + 3.4);
      flyTo(home.pos, home.target, 2200);
    }

    let visible = true;
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(stage);

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      if (!visible) return;
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      if (fly) {
        const k = Math.min(1, (performance.now() - fly.t0) / fly.ms);
        camera.position.lerpVectors(fly.fromP, fly.toP, ease(k));
        controls.target.lerpVectors(fly.fromT, fly.toT, ease(k));
        if (k >= 1) fly = null;
      }
      controls.update();
      cups.forEach((c, i) => {
        const active = i === hovered || i === selected;
        const s = THREE.MathUtils.lerp(c.scale.x, active ? 1.18 : 1, 0.15);

        c.position.y = c.userData.baseY + (active && !reduceMotion ? Math.sin(t * 4) * 0.02 + 0.03 : 0);
        if (c.userData.model) {
          // turn the real cup while it is picked; the drink sloshes a little as it starts moving
          if (active && !reduceMotion) c.userData.spin += dt * 0.8;
          c.userData.stir = THREE.MathUtils.lerp(c.userData.stir || 0, active ? 1 : 0, dt * 2);
          c.userData.model.step(dt, c.userData.spin, c.userData.stir);
        } else {
          c.rotation.y = active && !reduceMotion ? t * 0.8 : THREE.MathUtils.lerp(c.rotation.y, 0, 0.1);
        }
      });
      panels.forEach((p, i) => {
        const z = (i === hovered || i === selected) ? 0.08 : 0.001;
        p.position.z = THREE.MathUtils.lerp(p.position.z, z, 0.15);
      });
      if (!reduceMotion) {
        sparkles.rotation.y = Math.sin(t * 0.1) * 0.05;
        sparkles.position.y = Math.sin(t * 0.5) * 0.08;
        neonGlow.intensity = 2.4 + Math.sin(t * 3) * 0.15 + (Math.random() < 0.01 ? -1 : 0);
      }
      renderer.render(scene, camera);
    });

    // Veil lifts when the pictures are in, or after a few seconds regardless.
    setTimeout(() => loading.classList.add('is-done'), 4000);
  </script>

</body>
</html>
