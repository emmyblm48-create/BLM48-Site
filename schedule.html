<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official - Schedule</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css?family=Comfortaa:300,400" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* --- Month bar: "<- September    2026 10 October    November ->" + view toggle --- */
    .cal-top { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 16px; margin-bottom: 28px; }
    .cal-nav-btn {
      background: none; border: none; cursor: pointer; justify-self: start;
      font-family: var(--font-body); font-size: 12px; letter-spacing: 0.06em; color: var(--blm-ink);
      display: inline-flex; align-items: center; gap: 8px; padding-bottom: 6px; transition: opacity 0.2s;
    }
    .cal-nav-btn:hover { opacity: 0.55; }
    #calNext { justify-self: end; }
    .cal-month-display { display: flex; align-items: baseline; gap: 10px; }
    .cal-year, .cal-month-name { font-size: 12px; letter-spacing: 0.08em; }
    .cal-month-num { font-family: var(--font-display); font-size: clamp(30px, 3vw, 40px); font-weight: 300; line-height: 1; }
    .cal-view-toggle {
      position: absolute; right: 0; top: -62px; width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--blm-ink); color: #fff; font-size: 13px; transition: opacity 0.2s;
    }
    .cal-view-toggle:hover { opacity: 0.75; }

    /* --- Calendar grid --- */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-left: 1px solid #ddd; }
    .cal-weekday { text-align: center; padding: 14px 0 10px; font-size: 11px; letter-spacing: 0.06em; color: var(--blm-ink); border-right: 1px solid transparent; }
    .cal-grid > .cal-weekday:first-child { margin-left: -1px; border-left: 1px solid #fff; }
    .cal-weekday.is-sat { color: var(--cat-sky); }
    .cal-weekday.is-sun { color: var(--cat-pink); }
    .cal-cell { min-height: 120px; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .cal-grid > .cal-cell:nth-child(-n+14) { border-top: 1px solid #ddd; }
    .cal-cell.is-empty { background: #fafafa; }
    .cal-cell.is-today { background: var(--blm-gold-pale); }
    .cal-daynum { font-size: 11px; }
    .cal-daynum.is-sat { color: var(--cat-sky); }
    .cal-daynum.is-sun { color: var(--cat-pink); }
    .cal-event { display: block; text-decoration: none; color: inherit; transition: opacity 0.2s; }
    .cal-event:hover { opacity: 0.6; }
    .cal-event .cat-box { font-size: 8.5px; padding: 2px 6px 1px; margin-bottom: 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .cal-event-title { font-size: 10.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cal-more { font-size: 10px; color: var(--blm-ink-faint); }
    .cal-empty-state { grid-column: 1 / -1; padding: 60px 16px; text-align: center; color: var(--blm-ink-faint); font-size: 13px; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; }

    /* --- List view (the toggle): one row per event in the month --- */
    .cal-list { display: none; }
    .is-list .cal-grid { display: none; }
    .is-list .cal-list { display: flex; }
    .cal-list .status-line { padding: 40px 0; }

    @media (max-width: 720px) {
      .cal-cell { min-height: 76px; padding: 5px; }
      .cal-event .cat-box { display: none; }
      .cal-event-title { font-size: 9.5px; -webkit-line-clamp: 2; }
      .cal-weekday { font-size: 10px; }
      .cal-nav-btn span { display: none; }
      .cal-view-toggle { top: -58px; }
    }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>

  <main class="page-shell">
    <div class="page-hero"><h1 class="page-hero-title">Schedule</h1></div>

    <div class="cat-tabs" id="calTabs" hidden></div>

    <div id="calView">
      <div class="cal-top">
        <button type="button" class="cal-nav-btn" id="calPrev">&larr; <span id="calPrevLabel">&nbsp;</span></button>
        <div class="cal-month-display">
          <span class="cal-year" id="calYear"></span>
          <span class="cal-month-num" id="calMonthNum"></span>
          <span class="cal-month-name" id="calMonthName"></span>
        </div>
        <button type="button" class="cal-nav-btn" id="calNext"><span id="calNextLabel">&nbsp;</span> &rarr;</button>
        <button type="button" class="cal-view-toggle" id="calViewToggle" aria-label="Show as list" title="Show as list"><i class="fas fa-list" aria-hidden="true"></i></button>
      </div>

      <div class="cal-grid" id="calGrid">
        <p class="cal-empty-state">Loading schedule...</p>
      </div>
      <div class="info-list cal-list" id="calList"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/sheet-data.js"></script>
  <script>
    const WEEKDAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    // Tags take colours in first-seen order, same as Home's SCHEDULE list.
    const TAG_PALETTE = ['var(--cat-pink)', 'var(--cat-sky)', 'var(--cat-mint)', 'var(--cat-purple)', 'var(--cat-yellow)', 'var(--cat-blue)', 'var(--cat-gray)'];

    let allEvents = [];
    let tagOrder = [];
    let activeTag = 'all';
    let viewYear, viewMonth; // viewMonth is 0-indexed

    const pad2 = n => String(n).padStart(2, '0');

    function tagColorFor(tag) {
      const idx = tagOrder.indexOf((tag || '').trim().toLowerCase());
      return idx < 0 ? 'var(--cat-gray)' : TAG_PALETTE[idx % TAG_PALETTE.length];
    }

    function uniqueTags(events) {
      const seen = {};
      const tags = [];
      events.forEach(e => {
        const raw = (e.tag || '').trim();
        const key = raw.toLowerCase();
        if (key && !seen[key]) { seen[key] = true; tags.push(raw); }
      });
      return tags;
    }

    function renderTabs() {
      const tabsEl = document.getElementById('calTabs');
      const tags = uniqueTags(allEvents);
      if (!tags.length) return;
      tabsEl.hidden = false;

      const buttons = [{ label: 'All', tag: 'all', color: 'var(--blm-ink)' }]
        .concat(tags.map(t => ({ label: t, tag: t.toLowerCase(), color: tagColorFor(t) })));

      tabsEl.innerHTML = buttons.map(b => `
        <button type="button" class="${b.tag === activeTag ? 'is-current' : ''}" data-filter="${b.tag}" style="--tag:${b.color};">${b.label}</button>
      `).join('');

      tabsEl.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTag = btn.getAttribute('data-filter');
          renderTabs();
          renderCalendar();
        });
      });
    }

    function eventLinkAttrs(e) {
      return `href="${e.link || '#'}" ${e.link ? 'target="_blank" rel="noopener"' : 'onclick="return false;"'}`;
    }

    function renderCalendar() {
      const gridEl = document.getElementById('calGrid');

      document.getElementById('calYear').textContent = viewYear;
      document.getElementById('calMonthNum').textContent = viewMonth + 1;
      document.getElementById('calMonthName').textContent = MONTH_NAMES[viewMonth];

      const prevMonth = viewMonth === 0 ? 11 : viewMonth - 1;
      const nextMonth = viewMonth === 11 ? 0 : viewMonth + 1;
      document.getElementById('calPrevLabel').textContent = MONTH_NAMES[prevMonth];
      document.getElementById('calNextLabel').textContent = MONTH_NAMES[nextMonth];

      const filtered = activeTag === 'all' ? allEvents : allEvents.filter(e => (e.tag || '').trim().toLowerCase() === activeTag);

      const byDay = {};
      const monthEvents = [];
      filtered.forEach(e => {
        const d = new Date(e.date);
        if (isNaN(d) || d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) return;
        (byDay[d.getDate()] = byDay[d.getDate()] || []).push(e);
        monthEvents.push(e);
      });

      const firstOfMonth = new Date(viewYear, viewMonth, 1);
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const leadingBlanks = (firstOfMonth.getDay() + 6) % 7; // Monday-start offset
      const totalCells = Math.ceil((leadingBlanks + daysInMonth) / 7) * 7;

      const today = new Date();
      const isCurrentMonth = today.getFullYear() === viewYear && today.getMonth() === viewMonth;

      let html = WEEKDAY_LABELS.map((w, i) => `<div class="cal-weekday${i === 5 ? ' is-sat' : ''}${i === 6 ? ' is-sun' : ''}">${w}</div>`).join('');

      for (let i = 0; i < totalCells; i++) {
        const dayNum = i - leadingBlanks + 1;
        if (dayNum < 1 || dayNum > daysInMonth) {
          html += `<div class="cal-cell is-empty"></div>`;
          continue;
        }
        const weekdayIdx = i % 7;
        const dayEvents = (byDay[dayNum] || []).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
        const isToday = isCurrentMonth && today.getDate() === dayNum;

        const MAX_SHOWN = 4;
        const shown = dayEvents.slice(0, MAX_SHOWN);
        const extra = dayEvents.length - shown.length;

        const eventsHTML = shown.map(e => `
          <a class="cal-event" ${eventLinkAttrs(e)}>
            ${e.tag ? `<span class="cat-box" style="--tag:${tagColorFor(e.tag)};">${e.tag}</span>` : ''}
            <div class="cal-event-title">${e.title || ''}</div>
          </a>
        `).join('') + (extra > 0 ? `<span class="cal-more">+${extra} more</span>` : '');

        html += `
          <div class="cal-cell${isToday ? ' is-today' : ''}">
            <span class="cal-daynum${weekdayIdx === 5 ? ' is-sat' : ''}${weekdayIdx === 6 ? ' is-sun' : ''}">${dayNum}</span>
            ${eventsHTML}
          </div>
        `;
      }
      gridEl.innerHTML = html;

      // List view of the same month (big date + tag + title), in date order.
      const listEl = document.getElementById('calList');
      monthEvents.sort((a, b) => new Date(a.date) - new Date(b.date) || (a.time || '').localeCompare(b.time || ''));
      listEl.innerHTML = monthEvents.length ? monthEvents.map(e => {
        const d = new Date(e.date);
        return `
          <a class="sch-row" ${eventLinkAttrs(e)}>
            <div class="sch-date">
              <span class="sch-md">${pad2(d.getMonth() + 1)}.${pad2(d.getDate())}</span>
              <span class="sch-year">${BLM48Data.fmtDate(e.date).weekday.toUpperCase()}.${d.getFullYear()}</span>
            </div>
            <div class="sch-body">
              ${e.tag ? `<span class="cat-box" style="--tag:${tagColorFor(e.tag)};">${e.tag}</span>` : ''}
              <p class="info-title">${e.title || ''}</p>
            </div>
          </a>
        `;
      }).join('') : '<p class="status-line">No schedule this month.</p>';
    }

    function shiftMonth(delta) {
      viewMonth += delta;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderCalendar();
    }

    // Round dark button toggles calendar <-> list, like the reference page.
    document.getElementById('calViewToggle').addEventListener('click', e => {
      const view = document.getElementById('calView');
      const isList = view.classList.toggle('is-list');
      const btn = e.currentTarget;
      btn.innerHTML = `<i class="fas ${isList ? 'fa-calendar-days' : 'fa-list'}" aria-hidden="true"></i>`;
      btn.setAttribute('aria-label', isList ? 'Show as calendar' : 'Show as list');
      btn.title = btn.getAttribute('aria-label');
    });

    async function initSchedule() {
      const gridEl = document.getElementById('calGrid');
      const today = new Date();
      viewYear = today.getFullYear();
      viewMonth = today.getMonth();

      try {
        const rows = await BLM48Data.fetchSheet('Schedule');
        allEvents = rows.filter(r => r.date);
        tagOrder = uniqueTags(allEvents).map(t => t.toLowerCase());

        if (!allEvents.length) {
          gridEl.innerHTML = '<div class="cal-empty-state">No schedule yet.</div>';
          return;
        }

        document.getElementById('calPrev').addEventListener('click', () => shiftMonth(-1));
        document.getElementById('calNext').addEventListener('click', () => shiftMonth(1));

        renderTabs();
        renderCalendar();
      } catch (err) {
        gridEl.innerHTML = '<div class="cal-empty-state">Unable to load schedule right now.</div>';
      }
    }
    initSchedule();
  </script>

</body>
</html>
