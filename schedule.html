<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official - Schedule</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700;800&family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); color: var(--blm-ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    .schedule-list { max-width: 860px; margin: 0 auto; }
    .day-card {
      display: flex; align-items: center; gap: 26px;
      padding: 22px 4px;
      border-bottom: 1px solid var(--blm-line);
      transition: background 0.2s, padding 0.2s;
      text-decoration: none; color: inherit;
    }
    .day-card:first-child { padding-top: 4px; }
    .day-card:hover { background: var(--blm-paper-soft); border-radius: var(--radius-md); padding-left: 16px; padding-right: 16px; }

    .date-box { min-width: 82px; text-align: left; flex-shrink: 0; }
    .date-day { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--blm-ink); display: block; line-height: 1.1; }
    .date-num { font-size: 11px; color: var(--blm-ink-faint); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

    .event-info { flex-grow: 1; }
    .event-time { font-size: 12px; color: var(--blm-ink-faint); font-weight: 600; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
    .event-title { font-size: 15.5px; color: var(--blm-ink); font-weight: 700; line-height: 1.4; }

    @media (max-width: 600px) {
      .day-card { flex-wrap: wrap; padding: 18px 4px; }
      .date-box { min-width: auto; display: flex; align-items: baseline; gap: 10px; }
      .event-title { font-size: 14.5px; }
      .status-tag { margin-left: auto; }
    }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <span class="eyebrow">What's Coming Up</span>
      <h1 class="page-hero-title">Schedule</h1>
    </div>

    <div class="schedule-list" id="scheduleList">
      <p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">Loading schedule...</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/sheet-data.js"></script>
  <script>
    async function renderSchedule() {
      const listEl = document.getElementById('scheduleList');
      try {
        const rows = await BLM48Data.fetchSheet('Schedule');
        const items = rows
          .map(r => ({ ...r, _date: BLM48Data.fmtDate(r.date) }))
          .sort((a, b) => b._date.time - a._date.time);

        if (!items.length) {
          listEl.innerHTML = '<p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">No schedule yet.</p>';
          return;
        }

        listEl.innerHTML = items.map(item => {
          const tag = item.tag || '';
          const inner = `
            <div class="date-box"><span class="date-day">${item._date.weekday}</span><span class="date-num">${item._date.short}</span></div>
            <div class="event-info">
              <div class="event-time"><i class="far fa-clock"></i> ${item.time || ''}</div>
              <div class="event-title">${item.title || ''}</div>
            </div>
            <span class="kicker ${BLM48Data.tagClass(tag)} status-tag">${tag}</span>
          `;
          return item.link
            ? `<a href="${item.link}" target="_blank" rel="noopener" class="day-card">${inner}</a>`
            : `<div class="day-card">${inner}</div>`;
        }).join('');
      } catch (err) {
        listEl.innerHTML = '<p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">Unable to load schedule right now.</p>';
      }
    }
    renderSchedule();
  </script>

</body>
</html>
