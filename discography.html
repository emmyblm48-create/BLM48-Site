<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official - Discography</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css?family=Comfortaa:300,400" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* Radio inputs drive the filter, styled as the shared .cat-tabs */
    .disco-filter input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
    .cat-tabs label[for="single"] { --tag: var(--blm-cat-single); }
    .cat-tabs label[for="album"] { --tag: var(--blm-cat-album); }
    .cat-tabs label[for="special"] { --tag: var(--blm-cat-special); }
    .cat-tabs label[for="concert"] { --tag: var(--blm-cat-concert); }
    #all:checked ~ .cat-tabs label[for="all"],
    #single:checked ~ .cat-tabs label[for="single"],
    #album:checked ~ .cat-tabs label[for="album"],
    #special:checked ~ .cat-tabs label[for="special"],
    #concert:checked ~ .cat-tabs label[for="concert"] { border-bottom-color: currentColor; }
    .disco-filter input:focus-visible ~ .cat-tabs { outline: 1px dotted var(--blm-ink-faint); outline-offset: 6px; }

    .disco-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 46px clamp(14px, 2.4vw, 24px); }
    @media (max-width: 760px) { .disco-grid { grid-template-columns: repeat(2, 1fr); gap: 32px 14px; } }

    .disco-item { display: none; }
    #all:checked ~ .disco-grid .disco-item { display: block; }
    #single:checked ~ .disco-grid .cat-single { display: block; }
    #album:checked ~ .disco-grid .cat-album { display: block; }
    #special:checked ~ .disco-grid .cat-special { display: block; }
    #concert:checked ~ .disco-grid .cat-concert { display: block; }

    .cover-link { display: block; text-decoration: none; color: inherit; }
    .cover-box { width: 100%; aspect-ratio: 1; overflow: hidden; background: var(--blm-paper-soft); margin-bottom: 14px; }
    .cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
    .cover-link:hover .cover-box img { transform: scale(1.04); }
    .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; font-size: 10px; letter-spacing: 0.1em; }
    .cat-single .cat-box { --tag: var(--blm-cat-single); }
    .cat-album .cat-box { --tag: var(--blm-cat-album); }
    .cat-special .cat-box { --tag: var(--blm-cat-special); }
    .cat-concert .cat-box { --tag: var(--blm-cat-concert); }
    .title { font-family: var(--font-body); font-size: 13.5px; font-weight: 400; line-height: 1.6; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>

  <main class="page-shell">

    <div class="page-hero"><h1 class="page-hero-title">Discography</h1></div>

    <nav class="disco-filter">
        <input type="radio" id="all" name="disco_cat" checked>
        <input type="radio" id="single" name="disco_cat">
        <input type="radio" id="album" name="disco_cat">
        <input type="radio" id="special" name="disco_cat">
        <input type="radio" id="concert" name="disco_cat">

        <div class="cat-tabs">
            <label for="all">All</label>
            <label for="single">Single</label>
            <label for="album">Album</label>
            <label for="special">Special</label>
            <label for="concert">Concert</label>
        </div>

        <div class="disco-grid" id="discoGrid">
            <p class="status-line" style="grid-column:1/-1;">Loading discography...</p>
        </div>
    </nav>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/sheet-data.js"></script>
  <script>
    async function renderDiscography() {
      const gridEl = document.getElementById('discoGrid');
      try {
        const rows = await BLM48Data.fetchSheet('Discography');
        const items = rows
          .map(r => ({ ...r, _date: BLM48Data.fmtDate(r.date) }))
          .sort((a, b) => b._date.time - a._date.time);

        if (!items.length) {
          gridEl.innerHTML = '<p class="status-line" style="grid-column:1/-1;">No releases yet.</p>';
          return;
        }

        const catKey = c => String(c || 'single').trim().toLowerCase();
        const catLabel = key => key.charAt(0).toUpperCase() + key.slice(1);

        gridEl.innerHTML = items.map((item, i) => {
          const key = catKey(item.category);
          const d = new Date(item.date);
          const dateText = isNaN(d) ? item._date.full
            : d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
          return `
          <div class="disco-item cat-${key} reveal reveal-${(i % 6) + 1}">
            <a href="discography-detail?id=${encodeURIComponent(BLM48Data.discoId(item))}" class="cover-link">
              <div class="cover-box">
                <img src="${BLM48Data.driveImg(item.coverImage)}" alt="${item.title || ''}" loading="lazy" onerror="BLM48Data.imgRetry(this, 'https://via.placeholder.com/600x600?text=BLM48')">
              </div>
              <div class="item-info">
                <div class="meta"><span class="cat-box">${catLabel(key)}</span><span>${dateText} RELEASE</span></div>
                <h3 class="title">${item.title || ''}</h3>
              </div>
            </a>
          </div>
        `;
        }).join('');
      } catch (err) {
        gridEl.innerHTML = '<p class="status-line" style="grid-column:1/-1;">Unable to load discography right now.</p>';
      }
    }
    renderDiscography();
  </script>

</body>
</html>
