<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official - Discography</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700;800&family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); color: var(--blm-ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    .disco-filter { width: 100%; }
    .disco-filter input[type="radio"] { display: none; }

    .filter-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 48px; flex-wrap: wrap; }
    .filter-tabs label {
      background: var(--blm-paper); border: 1.5px solid var(--blm-line);
      border-radius: var(--radius-pill);
      font-family: var(--font-body); font-size: 12.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      color: var(--blm-ink-soft); cursor: pointer; padding: 11px 26px; transition: all 0.2s ease; text-align: center;
    }
    .filter-tabs label:hover { border-color: var(--blm-pink); color: var(--blm-pink-deep); }
    #all:checked ~ .filter-tabs label[for="all"],
    #single:checked ~ .filter-tabs label[for="single"],
    #album:checked ~ .filter-tabs label[for="album"],
    #special:checked ~ .filter-tabs label[for="special"],
    #concert:checked ~ .filter-tabs label[for="concert"] {
      background: var(--blm-pink); border-color: var(--blm-pink); color: #fff;
    }

    .disco-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 34px 24px; }
    @media (max-width: 1024px) { .disco-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 680px) {
      .disco-grid { grid-template-columns: repeat(2, 1fr); gap: 22px 14px; }
      .filter-tabs label { min-width: auto; padding: 9px 18px; font-size: 12px; }
    }

    .disco-item { display: none; }
    #all:checked ~ .disco-grid .disco-item { display: flex; }
    #single:checked ~ .disco-grid .cat-single { display: flex; }
    #album:checked ~ .disco-grid .cat-album { display: flex; }
    #special:checked ~ .disco-grid .cat-special { display: flex; }
    #concert:checked ~ .disco-grid .cat-concert { display: flex; }

    .disco-item { flex-direction: column; }
    .cover-link { width: 100%; text-decoration: none; color: inherit; }

    .cover-box { width: 100%; aspect-ratio: 1/1; overflow: hidden; background: var(--blm-paper-soft); border-radius: var(--radius-md); margin-bottom: 14px; border: 1px solid var(--blm-line); position: relative; transition: border-color 0.25s; }
    .disco-item:hover .cover-box { border-color: var(--blm-pink); }
    .cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .disco-item:hover .cover-box img { transform: scale(1.05); }

    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(0deg, rgba(21,16,12,0.72) 0%, transparent 55%);
      display: flex; justify-content: flex-start; align-items: flex-end;
      padding: 14px; opacity: 0; transition: all 0.3s ease;
    }
    .overlay span { font-weight: 800; letter-spacing: 1px; text-transform: uppercase; font-size: 11.5px; color: #fff; display: inline-flex; align-items: center; gap: 6px; }
    .disco-item:hover .overlay { opacity: 1; }
    @media (hover: none) { .overlay { opacity: 1; background: linear-gradient(0deg, rgba(21,16,12,0.4) 0%, transparent 55%); } .overlay span { display: none; } }

    .item-info { width: 100%; }
    .meta { font-size: 10.5px; font-weight: 700; color: var(--blm-ink-faint); margin-bottom: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .date { color: var(--blm-ink-faint); }

    .title { font-family: var(--font-display); font-size: 15px; font-weight: 700; margin: 0; color: var(--blm-ink); line-height: 1.4; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>

  <main class="page-shell">

    <div class="page-hero">
      <span class="eyebrow">Music &amp; Releases</span>
      <h1 class="page-hero-title">Discography</h1>
    </div>

    <nav class="disco-filter">
        <input type="radio" id="all" name="disco_cat" checked>
        <input type="radio" id="single" name="disco_cat">
        <input type="radio" id="album" name="disco_cat">
        <input type="radio" id="special" name="disco_cat">
        <input type="radio" id="concert" name="disco_cat">

        <div class="filter-tabs">
            <label for="all">All</label>
            <label for="single">Single</label>
            <label for="album">Album</label>
            <label for="special">Special</label>
            <label for="concert">Concert</label>
        </div>

        <div class="disco-grid" id="discoGrid">
            <p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">Loading discography...</p>
        </div>
    </nav>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/sheet-data.js"></script>
  <script>
    async function renderDiscography() {
      const gridEl = document.getElementById('discoGrid');
      try {
        const rows = await BLM48Data.fetchSheet('Discography');
        const items = rows
          .map(r => ({ ...r, _date: BLM48Data.fmtDate(r.date) }))
          .sort((a, b) => b._date.time - a._date.time);

        if (!items.length) {
          gridEl.innerHTML = '<p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">No releases yet.</p>';
          return;
        }

        const catClass = c => 'cat-' + String(c || 'single').trim().toLowerCase();

        gridEl.innerHTML = items.map(item => `
          <div class="disco-item ${catClass(item.category)}">
            <a href="${item.link || '#'}" target="_blank" rel="noopener" class="cover-link">
              <div class="cover-box">
                <img src="${BLM48Data.driveImg(item.coverImage)}" alt="${item.title || ''}" onerror="this.src='https://via.placeholder.com/600x600?text=BLM48'">
                <div class="overlay"><span><i class="fas fa-play"></i> Watch MV</span></div>
              </div>
              <div class="item-info">
                <div class="meta"><span class="kicker ${BLM48Data.styleClass(item.kickerStyle)}">${item.kicker || ''}</span><span class="date">${item._date.full}</span></div>
                <h3 class="title">${item.title || ''}</h3>
              </div>
            </a>
          </div>
        `).join('');
      } catch (err) {
        gridEl.innerHTML = '<p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">Unable to load discography right now.</p>';
      }
    }
    renderDiscography();
  </script>

</body>
</html>
