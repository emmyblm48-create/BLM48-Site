<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official - Discography</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css?family=Comfortaa:300,400" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); color: var(--blm-ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    .disco-filter { width: 100%; }
    .disco-filter input[type="radio"] { display: none; }

    .filter-tabs { display: flex; justify-content: flex-start; gap: 28px; margin-bottom: 52px; flex-wrap: wrap; border-bottom: none; padding-bottom: 0; }
    .filter-tabs label {
      background: none; border: none;
      font-family: var(--font-body); font-size: 12.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; padding: 0 0 8px; transition: opacity 0.2s ease; text-align: center;
      position: relative; color: var(--blm-tab-color, var(--blm-ink-soft)); opacity: 0.6;
    }
    .filter-tabs label[for="single"] { --blm-tab-color: var(--blm-cat-single); }
    .filter-tabs label[for="album"] { --blm-tab-color: var(--blm-cat-album); }
    .filter-tabs label[for="special"] { --blm-tab-color: var(--blm-cat-special); }
    .filter-tabs label[for="concert"] { --blm-tab-color: var(--blm-cat-concert); }
    .filter-tabs label:hover { opacity: 1; }
    #all:checked ~ .filter-tabs label[for="all"],
    #single:checked ~ .filter-tabs label[for="single"],
    #album:checked ~ .filter-tabs label[for="album"],
    #special:checked ~ .filter-tabs label[for="special"],
    #concert:checked ~ .filter-tabs label[for="concert"] {
      opacity: 1;
    }
    #all:checked ~ .filter-tabs label[for="all"]::after,
    #single:checked ~ .filter-tabs label[for="single"]::after,
    #album:checked ~ .filter-tabs label[for="album"]::after,
    #special:checked ~ .filter-tabs label[for="special"]::after,
    #concert:checked ~ .filter-tabs label[for="concert"]::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: currentColor;
    }

    .disco-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px 32px; }
    @media (max-width: 900px) { .disco-grid { grid-template-columns: repeat(2, 1fr); gap: 36px 20px; } }
    @media (max-width: 480px) { .disco-grid { grid-template-columns: 1fr; } .filter-tabs { gap: 18px; } }

    .disco-item { display: none; }
    #all:checked ~ .disco-grid .disco-item { display: flex; }
    #single:checked ~ .disco-grid .cat-single { display: flex; }
    #album:checked ~ .disco-grid .cat-album { display: flex; }
    #special:checked ~ .disco-grid .cat-special { display: flex; }
    #concert:checked ~ .disco-grid .cat-concert { display: flex; }

    .disco-item { flex-direction: column; }
    .cover-link { width: 100%; text-decoration: none; color: inherit; }

    .cover-box { width: 100%; aspect-ratio: 1/1; overflow: hidden; background: var(--blm-paper-soft); margin-bottom: 16px; position: relative; }
    .cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
    .disco-item:hover .cover-box img { transform: scale(1.04); }

    .item-info { width: 100%; }
    .meta { font-size: 12.5px; font-weight: 700; color: var(--blm-ink); margin-bottom: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .cat-tag { border: 1px solid var(--blm-tag-color, var(--blm-ink-faint)); color: var(--blm-tag-color, var(--blm-ink-faint)); font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; }
    .cat-single .cat-tag { --blm-tag-color: var(--blm-cat-single); }
    .cat-album .cat-tag { --blm-tag-color: var(--blm-cat-album); }
    .cat-special .cat-tag { --blm-tag-color: var(--blm-cat-special); }
    .cat-concert .cat-tag { --blm-tag-color: var(--blm-cat-concert); }
    .date { color: var(--blm-ink-faint); font-weight: 600; }

    .title { font-family: var(--font-body); font-size: 14px; font-weight: 500; margin: 0; color: var(--blm-ink-soft); line-height: 1.5; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>

  <main class="page-shell">

    <div class="page-hero">
      <span class="eyebrow">Music &amp; Releases</span>
      <h1 class="page-hero-title">Discography</h1>
    </div>

    <nav class="disco-filter">
        <input type="radio" id="all" name="disco_cat" checked>
        <input type="radio" id="single" name="disco_cat">
        <input type="radio" id="album" name="disco_cat">
        <input type="radio" id="special" name="disco_cat">
        <input type="radio" id="concert" name="disco_cat">

        <div class="filter-tabs">
            <label for="all">All</label>
            <label for="single">Single</label>
            <label for="album">Album</label>
            <label for="special">Special</label>
            <label for="concert">Concert</label>
        </div>

        <div class="disco-grid" id="discoGrid">
            <p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">Loading discography...</p>
        </div>
    </nav>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/sheet-data.js"></script>
  <script>
    async function renderDiscography() {
      const gridEl = document.getElementById('discoGrid');
      try {
        const rows = await BLM48Data.fetchSheet('Discography');
        const items = rows
          .map(r => ({ ...r, _date: BLM48Data.fmtDate(r.date) }))
          .sort((a, b) => b._date.time - a._date.time);

        if (!items.length) {
          gridEl.innerHTML = '<p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">No releases yet.</p>';
          return;
        }

        const catKey = c => String(c || 'single').trim().toLowerCase();
        const catLabel = key => key.charAt(0).toUpperCase() + key.slice(1);

        gridEl.innerHTML = items.map((item, i) => {
          const key = catKey(item.category);
          return `
          <div class="disco-item cat-${key} reveal reveal-${(i % 6) + 1}">
            <a href="${item.link || '#'}" target="_blank" rel="noopener" class="cover-link">
              <div class="cover-box">
                <img src="${BLM48Data.driveImg(item.coverImage)}" alt="${item.title || ''}" onerror="this.src='https://via.placeholder.com/600x600?text=BLM48'">
              </div>
              <div class="item-info">
                <div class="meta"><span class="cat-tag">${catLabel(key)}</span><span>RELEASE</span><span class="date">${item._date.full}</span></div>
                <h3 class="title">${item.title || ''}</h3>
              </div>
            </a>
          </div>
        `;
        }).join('');
      } catch (err) {
        gridEl.innerHTML = '<p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">Unable to load discography right now.</p>';
      }
    }
    renderDiscography();
  </script>

</body>
</html>
