<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official - Profile</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css?family=Comfortaa:300,400" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* --- Loading --- */
    #loading-overlay { text-align: center; padding: 90px 0; color: var(--blm-ink-soft); letter-spacing: 0.2em; text-transform: uppercase; font-size: 11px; }
    .spinner-ring { width: 36px; height: 36px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid var(--blm-line); border-top-color: var(--blm-gold); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* rounded-square ("squircle") photo frame */
    .squircle { border-radius: 26%; overflow: hidden; background: var(--blm-gold-pale); }

    /* --- Grid: 3 across, everything centred under the photo --- */
    #main-view { display: none; }
    .members-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 50px clamp(14px, 2.4vw, 24px); }
    @media (max-width: 760px) { .members-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px 14px; } }

    .member-card { text-align: center; }
    .photo-box { display: block; width: 100%; aspect-ratio: 1; cursor: pointer; margin-bottom: 14px; }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
    .member-card:hover .photo-box img { transform: scale(1.04); }
    .member-name-main { font-size: 14.5px; letter-spacing: 0.08em; cursor: pointer; }
    .member-name-sub { font-size: 11px; letter-spacing: 0.04em; overflow-wrap: anywhere; color: var(--blm-ink); margin-top: 6px; text-transform: uppercase; cursor: pointer; }
    .card-socials { display: flex; justify-content: center; gap: 10px; margin-top: 10px; min-height: 20px; }
    .card-social-link { color: var(--blm-ink); font-size: 17px; transition: opacity 0.2s; }
    .card-social-link:hover { opacity: 0.55; }

    /* --- Detail view --- */
    #detail-view { display: none; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .back-btn { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 40px; transition: opacity 0.2s; }
    .back-btn::before { content: '\2190'; font-size: 13px; }
    .back-btn:hover { opacity: 0.55; }
    .detail-layout { display: flex; gap: clamp(30px, 5vw, 70px); align-items: flex-start; }
    .detail-image-box { flex: 0 0 min(380px, 42%); }
    .detail-image { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .detail-content { flex: 1; min-width: 0; }
    .info-header { margin-bottom: 28px; }
    #m-name-th { font-family: var(--font-display); font-size: clamp(24px, 2.6vw, 32px); font-weight: 300; letter-spacing: 0.06em; }
    #m-name-en { margin-top: 8px; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--blm-ink-soft); }
    .info-row { display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--blm-line); }
    .info-row:first-child { border-top: 1px solid var(--blm-line); }
    .info-label { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--blm-ink-soft); padding-top: 2px; }
    .info-value { font-size: 14px; }
    .social-section { display: flex; gap: 12px; margin-top: 30px; }
    .social-link { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--blm-gold); color: var(--blm-ink); font-size: 16px; text-decoration: none; transition: transform 0.2s; }
    .social-link:hover { transform: translateY(-3px); }
    @media (max-width: 760px) {
      .detail-layout { flex-direction: column; align-items: center; }
      .detail-image-box { flex-basis: auto; width: min(320px, 80%); }
      .detail-content { width: 100%; }
      .info-header { text-align: center; }
      .social-section { justify-content: center; }
      .info-row { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/sheet-data.js"></script>

  <main class="page-shell">
    <div class="page-hero"><h1 class="page-hero-title">Profile</h1></div>

    <div id="loading-overlay">
      <div class="spinner-ring"></div>
      <div>Loading BLM48...</div>
    </div>

    <div id="main-view">
      <div class="cat-tabs" id="teamTabs">
        <button type="button" class="is-current" onclick="filterByTeam(this, 'ALL')">All</button>
        <button type="button" onclick="filterByTeam(this, 'Bloom')">Team Bloom</button>
        <button type="button" onclick="filterByTeam(this, 'Trainee')">Trainee</button>
      </div>
      <div id="member-grid" class="members-grid"></div>
    </div>

    <div id="detail-view">
      <div class="back-btn" onclick="goBack()"><span>Back</span></div>
      <div class="detail-layout">
        <div class="detail-image-box squircle"><img id="m-img" class="detail-image" alt="Member Photo"></div>
        <div class="detail-content">
          <div class="info-header">
            <h1 id="m-name-th"></h1>
            <p id="m-name-en"></p>
          </div>
          <div id="m-info-table"></div>
          <div class="social-section" id="m-social"></div>
        </div>
      </div>
    </div>

  </main>

  <div id="site-footer"></div>

  <script>
    let membersData = [];

    function getDirectImgLink(url) {
      return BLM48Data.driveImg(url, 'https://via.placeholder.com/400x400?text=BLM48');
    }

    let currentTeamFilter = 'ALL';
    let currentMemberName = null;

    async function init() {
      try {
        membersData = await BLM48Data.fetchMembers();
        renderGrid('ALL');
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
      } catch (err) {
        document.getElementById('loading-overlay').innerHTML = "Error loading data";
      }
    }

    function filterByTeam(btn, team) {
      document.querySelectorAll('#teamTabs button').forEach(b => b.classList.remove('is-current'));
      btn.classList.add('is-current');
      currentTeamFilter = team;
      renderGrid(team);
    }

    function renderGrid(team) {
      const grid = document.getElementById('member-grid');
      grid.innerHTML = '';
      const filtered = team === 'ALL' ? membersData : membersData.filter(m => m.team === team);

      filtered.forEach((m, i) => {
        const nameMain = m.name;
        const nameSub = (m.fullNameEN || m.name).toUpperCase();

        let socialsHTML = '';
        if (m.instagram && m.instagram !== '-') socialsHTML += `<a href="${m.instagram}" class="card-social-link" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="fab fa-instagram"></i></a>`;
        if (m.tiktok && m.tiktok !== '-') socialsHTML += `<a href="${m.tiktok}" class="card-social-link" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="fab fa-tiktok"></i></a>`;
        if (m.twitter && m.twitter !== '-') socialsHTML += `<a href="${m.twitter}" class="card-social-link" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="fab fa-x-twitter"></i></a>`;

        grid.innerHTML += `
          <div class="member-card reveal reveal-${(i % 6) + 1}" data-name="${m.name}">
            <div class="photo-box squircle" onclick="viewDetail('${m.name}')">
              <img src="${getDirectImgLink(m.image)}" alt="${m.name}" loading="lazy" onerror="BLM48Data.imgRetry(this, 'https://via.placeholder.com/400x400?text=BLM48')">
            </div>
            <div class="member-name-main" onclick="viewDetail('${m.name}')">${nameMain}</div>
            <div class="member-name-sub" onclick="viewDetail('${m.name}')">${nameSub}</div>
            <div class="card-socials">${socialsHTML}</div>
          </div>
        `;
      });
    }

    function viewDetail(nickname) {
      const m = membersData.find(item => item.name === nickname);
      if (!m) return;
      currentMemberName = nickname;
      document.getElementById('m-img').src = getDirectImgLink(m.image);
      document.getElementById('m-name-th').innerText = m.fullNameTH || m.name;
      document.getElementById('m-name-en').innerText = m.fullNameEN || '';

      const infoList = [
        { label: 'Generation', value: m.generation },
        { label: 'Team', value: m.team },
        { label: 'Birthday', value: m.birthday },
        { label: 'Oshimark', value: m.oshiMark },
        { label: 'Province', value: m.province },
        { label: 'Blood Type', value: m.bloodType },
        { label: 'MBTI', value: m.mbti },
        { label: 'Like', value: m.like },
        { label: 'Hobby', value: m.hobby }
      ];

      document.getElementById('m-info-table').innerHTML = infoList.map(item => `
        <div class="info-row">
          <div class="info-label">${item.label}</div>
          <div class="info-value">${item.value || '-'}</div>
        </div>
      `).join('');

      let sHTML = '';
      if (m.instagram && m.instagram !== '-') sHTML += `<a href="${m.instagram}" class="social-link" target="_blank"><i class="fab fa-instagram"></i></a>`;
      if (m.tiktok && m.tiktok !== '-') sHTML += `<a href="${m.tiktok}" class="social-link" target="_blank"><i class="fab fa-tiktok"></i></a>`;
      if (m.twitter && m.twitter !== '-') sHTML += `<a href="${m.twitter}" class="social-link" target="_blank"><i class="fab fa-x-twitter"></i></a>`;
      document.getElementById('m-social').innerHTML = sHTML;

      document.getElementById('main-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function goBack() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('main-view').style.display = 'block';

      const card = currentMemberName && document.querySelector(`.member-card[data-name="${CSS.escape(currentMemberName)}"]`);
      if (card) {
        card.scrollIntoView({ block: 'center' });
      } else {
        window.scrollTo(0, 0);
      }
    }

    init();
  </script>
</body>
</html>
