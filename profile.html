<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official - Profile</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css?family=Comfortaa:300,400" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); color: var(--blm-ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* --- Loading --- */
    #loading-overlay { text-align: center; padding: 90px 0; color: var(--blm-ink-soft); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; }
    .spinner-ring { width: 40px; height: 40px; margin: 0 auto 18px; border-radius: 50%; border: 4px solid var(--blm-line); border-top-color: var(--blm-gold); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Filter Tabs --- */
    .filter-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 48px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--blm-paper); border: 1.5px solid var(--blm-line);
      border-radius: var(--radius-pill);
      font-family: var(--font-body); font-size: 12.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      color: var(--blm-ink-soft); cursor: pointer; padding: 11px 26px; transition: all 0.2s ease;
    }
    .tab-btn.active, .tab-btn:hover { background: var(--blm-pink); border-color: var(--blm-pink); color: #fff; }

    /* --- Main Grid --- */
    #main-view { display: none; }
    .members-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 34px 24px; }
    @media (max-width: 1024px) { .members-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 680px) { .members-grid { grid-template-columns: repeat(2, 1fr); gap: 22px 14px; } }

    .member-card { display: flex; flex-direction: column; }
    .photo-box { width: 100%; aspect-ratio: 3/4; overflow: hidden; background: var(--blm-paper-soft); border-radius: var(--radius-md); margin-bottom: 14px; cursor: pointer; border: 1px solid var(--blm-line); transition: border-color 0.25s; }
    .member-card:hover .photo-box { border-color: var(--blm-pink); }
    .member-photo { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .member-card:hover .member-photo { transform: scale(1.05); }

    .card-info { width: 100%; }
    .card-name-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .member-name-main { font-family: var(--font-display); font-size: 17px; font-weight: 800; color: var(--blm-ink); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .member-name-sub { font-size: 11px; font-weight: 700; color: var(--blm-ink-faint); letter-spacing: 0.5px; margin-top: 3px; text-transform: uppercase; cursor: pointer; }
    .card-socials { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .card-social-link { color: var(--blm-ink-faint); font-size: 13px; transition: color 0.2s, transform 0.2s; }
    .card-social-link:hover { color: var(--blm-pink-deep); transform: translateY(-2px); }

    /* --- Detail View --- */
    #detail-view { display: none; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--blm-ink); cursor: pointer; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 32px; transition: gap 0.2s, color 0.2s; font-size: 12.5px; }
    .back-btn::before { content: '\f060'; font-family: 'Font Awesome 6 Free'; font-weight: 900; font-size: 12px; }
    .back-btn:hover { gap: 12px; color: var(--blm-gold-deep); }

    .detail-layout { display: flex; flex-direction: row; gap: 48px; text-align: left; }
    .detail-image-box { flex: 1; min-width: 280px; max-width: 400px; }
    .detail-image { width: 100%; border: 1px solid var(--blm-line); border-radius: var(--radius-lg); display: block; }
    .detail-content { flex: 1.5; min-width: 280px; }

    .info-header { border-bottom: 3px solid var(--blm-pink); padding-bottom: 18px; margin-bottom: 22px; }
    #m-name-th { font-family: var(--font-display); font-size: 34px; margin: 0; color: var(--blm-ink); font-weight: 800; letter-spacing: -0.5px; }
    #m-name-en { color: var(--blm-ink-faint); font-size: 13px; margin: 6px 0 0 0; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

    .info-row { display: grid; grid-template-columns: 140px 1fr; padding: 13px 0; border-bottom: 1px solid var(--blm-line); }
    .info-label { color: var(--blm-ink-faint); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .info-value { color: var(--blm-ink); font-size: 15px; font-weight: 600; }

    .social-section { display: flex; gap: 10px; margin-top: 28px; }
    .social-link {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%;
      background: transparent; border: 1px solid var(--blm-line); color: var(--blm-ink); font-size: 16px;
      text-decoration: none; transition: all 0.25s ease;
    }
    .social-link:hover { background: var(--blm-gold); border-color: var(--blm-gold); color: var(--blm-on-gold); }

    @media (max-width: 768px) {
      .detail-layout { flex-direction: column; align-items: center; }
      .detail-image-box, .detail-content { min-width: 100%; max-width: 100%; }
      .info-header { text-align: center; }
      .social-section { justify-content: center; }
    }
    @media (max-width: 480px) {
      .info-row { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <span class="eyebrow">The Lineup</span>
      <h1 class="page-hero-title">Profile</h1>
    </div>

    <div id="loading-overlay">
      <div class="spinner-ring"></div>
      <div>Loading BLM48...</div>
    </div>

    <div id="main-view">
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterByTeam(this, 'ALL')">All</button>
        <button class="tab-btn" onclick="filterByTeam(this, 'Bloom')">Team Bloom</button>
        <button class="tab-btn" onclick="filterByTeam(this, 'Trainee')">Trainee</button>
      </div>
      <div id="member-grid" class="members-grid"></div>
    </div>

    <div id="detail-view">
      <div class="back-btn" onclick="goBack()"><span>Back</span></div>
      <div class="detail-layout">
        <div class="detail-image-box"><img id="m-img" class="detail-image" alt="Member Photo"></div>
        <div class="detail-content">
          <div class="info-header">
            <h1 id="m-name-th"></h1>
            <p id="m-name-en"></p>
          </div>
          <div id="m-info-table"></div>
          <div class="social-section" id="m-social"></div>
        </div>
      </div>
    </div>

  </main>

  <div id="site-footer"></div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyKX1fncf8dJuPWadPk9w-4t0pPnkNPZlFDvUqllC1aJwbqQ4vVdepMcU6fjbTIOHqz/exec';
    let membersData = [];

    function getDirectImgLink(url) {
      if (!url) return 'https://via.placeholder.com/400x533?text=BLM48';
      if (url.includes('drive.google.com')) {
        const fileId = url.match(/[-\w]{25,}/);
        return fileId ? `https://lh3.googleusercontent.com/u/0/d/${fileId}` : url;
      }
      return url;
    }

    let currentTeamFilter = 'ALL';
    let currentMemberName = null;

    async function init() {
      try {
        const response = await fetch(scriptURL);
        membersData = await response.json();
        renderGrid('ALL');
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
      } catch (err) {
        document.getElementById('loading-overlay').innerHTML = "Error loading data";
      }
    }

    function filterByTeam(btn, team) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTeamFilter = team;
      renderGrid(team);
    }

    function renderGrid(team) {
      const grid = document.getElementById('member-grid');
      grid.innerHTML = '';
      const filtered = team === 'ALL' ? membersData : membersData.filter(m => m.team === team);

      filtered.forEach(m => {
        const nameMain = m.name;
        const nameSub = (m.fullNameEN || m.name).toUpperCase();

        let socialsHTML = '';
        if (m.instagram && m.instagram !== '-') socialsHTML += `<a href="${m.instagram}" class="card-social-link" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="fab fa-instagram"></i></a>`;
        if (m.tiktok && m.tiktok !== '-') socialsHTML += `<a href="${m.tiktok}" class="card-social-link" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="fab fa-tiktok"></i></a>`;
        if (m.twitter && m.twitter !== '-') socialsHTML += `<a href="${m.twitter}" class="card-social-link" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="fab fa-x-twitter"></i></a>`;

        grid.innerHTML += `
          <div class="member-card" data-name="${m.name}">
            <div class="photo-box" onclick="viewDetail('${m.name}')">
              <img src="${getDirectImgLink(m.image)}" class="member-photo" onerror="this.src='https://via.placeholder.com/400x533?text=BLM48'">
            </div>
            <div class="card-info">
              <div class="card-name-row">
                <div class="member-name-main" onclick="viewDetail('${m.name}')">${nameMain}</div>
                <div class="card-socials">${socialsHTML}</div>
              </div>
              <div class="member-name-sub" onclick="viewDetail('${m.name}')">${nameSub}</div>
            </div>
          </div>
        `;
      });
    }

    function viewDetail(nickname) {
      const m = membersData.find(item => item.name === nickname);
      if (!m) return;
      currentMemberName = nickname;
      document.getElementById('m-img').src = getDirectImgLink(m.image);
      document.getElementById('m-name-th').innerText = m.fullNameTH || m.name;
      document.getElementById('m-name-en').innerText = m.fullNameEN || '';

      const infoList = [
        { label: 'Generation', value: m.generation },
        { label: 'Team', value: m.team },
        { label: 'Birthday', value: m.birthday },
        { label: 'Oshimark', value: m.oshiMark },
        { label: 'Province', value: m.province },
        { label: 'Blood Type', value: m.bloodType },
        { label: 'MBTI', value: m.mbti },
        { label: 'Like', value: m.like },
        { label: 'Hobby', value: m.hobby }
      ];

      document.getElementById('m-info-table').innerHTML = infoList.map(item => `
        <div class="info-row">
          <div class="info-label">${item.label}</div>
          <div class="info-value">${item.value || '-'}</div>
        </div>
      `).join('');

      let sHTML = '';
      if (m.instagram && m.instagram !== '-') sHTML += `<a href="${m.instagram}" class="social-link" target="_blank"><i class="fab fa-instagram"></i></a>`;
      if (m.tiktok && m.tiktok !== '-') sHTML += `<a href="${m.tiktok}" class="social-link" target="_blank"><i class="fab fa-tiktok"></i></a>`;
      if (m.twitter && m.twitter !== '-') sHTML += `<a href="${m.twitter}" class="social-link" target="_blank"><i class="fab fa-x-twitter"></i></a>`;
      document.getElementById('m-social').innerHTML = sHTML;

      document.getElementById('main-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function goBack() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('main-view').style.display = 'block';

      const card = currentMemberName && document.querySelector(`.member-card[data-name="${CSS.escape(currentMemberName)}"]`);
      if (card) {
        card.scrollIntoView({ block: 'center' });
      } else {
        window.scrollTo(0, 0);
      }
    }

    init();
  </script>
</body>
</html>
