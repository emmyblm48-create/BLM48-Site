<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official - News</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700;800&family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); color: var(--blm-ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    .news-list { max-width: 860px; margin: 0 auto; }
    .news-item {
      display: flex; align-items: center; gap: 24px;
      text-decoration: none; color: inherit;
      padding: 22px 4px;
      border-bottom: 1px solid var(--blm-line);
      transition: background 0.2s, padding 0.2s;
    }
    .news-item:first-child { padding-top: 4px; }
    .news-item:hover { background: var(--blm-paper-soft); border-radius: var(--radius-md); padding-left: 16px; padding-right: 16px; }
    .news-date-group { display: flex; flex-direction: column; gap: 8px; min-width: 108px; flex-shrink: 0; }
    .news-date { font-size: 12px; color: var(--blm-ink-faint); font-weight: 600; }
    .news-title { color: var(--blm-ink); font-size: 15.5px; font-weight: 700; line-height: 1.45; flex-grow: 1; }
    .news-item:hover .news-title { color: var(--blm-pink-deep); }
    .news-arrow { color: var(--blm-ink-faint); font-size: 15px; transition: 0.2s; flex-shrink: 0; }
    .news-item:hover .news-arrow { color: var(--blm-pink-deep); transform: translateX(4px); }

    @media (max-width: 600px) {
      .news-item { flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px 4px; }
      .news-date-group { flex-direction: row; min-width: auto; }
      .news-title { font-size: 14.5px; }
      .news-arrow { display: none; }
    }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <span class="eyebrow">Latest Updates</span>
      <h1 class="page-hero-title">News</h1>
    </div>
    <div class="news-list" id="newsList">
      <p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">Loading news...</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/sheet-data.js"></script>
  <script>
    async function renderNews() {
      const listEl = document.getElementById('newsList');
      try {
        const rows = await BLM48Data.fetchSheet('News');
        const items = rows
          .map(r => ({ ...r, _date: BLM48Data.fmtDate(r.date) }))
          .sort((a, b) => b._date.time - a._date.time);

        if (!items.length) {
          listEl.innerHTML = '<p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">No news yet.</p>';
          return;
        }

        listEl.innerHTML = items.map(item => `
          <a href="${item.link || '#'}" target="_blank" rel="noopener" class="news-item">
            <div class="news-date-group"><span class="kicker ${BLM48Data.tagClass(item.tag)}">${item.tag || ''}</span><span class="news-date">${item._date.full}</span></div>
            <div class="news-title">${item.title || ''}</div>
            <div class="news-arrow"><i class="fas fa-arrow-right"></i></div>
          </a>
        `).join('');
      } catch (err) {
        listEl.innerHTML = '<p style="color:var(--blm-ink-faint);font-weight:600;padding:20px 4px;">Unable to load news right now.</p>';
      }
    }
    renderNews();
  </script>

</body>
</html>
