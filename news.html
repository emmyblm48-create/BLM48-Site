<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="nUjG8w2pz2CXK7Uvg8EMmn2S6hvwQOCNbg_IDFtMRcg" />
  <title>BLM48 Official - News</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css?family=Comfortaa:300,400" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    /* rows, tabs and pager come from site.css */
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>

  <main class="page-shell">
    <div class="page-hero"><h1 class="page-hero-title">News</h1></div>

    <div class="cat-tabs" id="newsTabs" hidden></div>

    <div class="info-list" id="newsList"><p class="status-line">Loading news...</p></div>

    <nav class="pager" id="newsPager" aria-label="Pages" hidden></nav>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/sheet-data.js"></script>
  <script>
    // Fallback for a missing/broken news picture: the BLM48 wordmark on band yellow.
    var THUMB_LOGO = '<span class="wordmark" role="img" aria-label="BLM48"></span>';
    var PER_PAGE = 10;

    // One colour per tag, assigned by alphabetical position so the same tag
    // matches the colour on Home's NEWS list (which computes it the same way).
    var TAG_PALETTE = ['var(--cat-pink)', 'var(--cat-sky)', 'var(--cat-mint)', 'var(--cat-purple)', 'var(--cat-yellow)', 'var(--cat-blue)', 'var(--cat-gray)'];

    var allItems = [];
    var tagOrder = [];
    var activeTag = 'all';
    var page = 1;

    function tagColor(tag) {
      var idx = tagOrder.indexOf((tag || '').trim().toLowerCase());
      return idx < 0 ? 'var(--cat-gray)' : TAG_PALETTE[idx % TAG_PALETTE.length];
    }

    // Items from the last 3 days get a "New!" mark.
    function isRecent(dateValue) {
      var d = new Date(dateValue);
      if (isNaN(d)) return false;
      var diffDays = (Date.now() - d.getTime()) / (1000 * 60 * 60 * 24);
      return diffDays >= 0 && diffDays <= 3;
    }

    function pad2(n) { return String(n).padStart(2, '0'); }

    function rowHTML(item, i) {
      var imgSrc = item.image || item.thumbnail || item.thumb || '';
      var thumb = imgSrc
        ? '<img src="' + BLM48Data.driveImg(imgSrc) + '" alt="" loading="lazy" onerror="if (!this.dataset.retried) { BLM48Data.imgRetry(this); } else { this.onerror = null; this.outerHTML = THUMB_LOGO; }">'
        : THUMB_LOGO;
      var d = new Date(item.date);
      var dateText = isNaN(d) ? item._date.full : d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate());
      return '' +
        '<a href="' + (item.link || '#') + '" target="_blank" rel="noopener" class="info-row reveal reveal-' + ((i % 6) + 1) + '">' +
          '<div class="info-thumb">' + thumb + '</div>' +
          '<div>' +
            '<div class="info-meta">' +
              '<span class="info-date">' + dateText + '</span>' +
              '<span class="cat-box" style="--tag:' + tagColor(item.tag) + ';">' + (item.tag || 'News') + '</span>' +
            '</div>' +
            '<p class="info-title">' + (item.title || '') + (isRecent(item.date) ? '<span class="new-mark">New!</span>' : '') + '</p>' +
          '</div>' +
        '</a>';
    }

    function filtered() {
      return activeTag === 'all' ? allItems : allItems.filter(function (it) { return (it.tag || '').trim().toLowerCase() === activeTag; });
    }

    function renderTabs() {
      var tabsEl = document.getElementById('newsTabs');
      var seen = {}; var tags = [];
      allItems.forEach(function (item) {
        var raw = (item.tag || '').trim();
        if (raw && !seen[raw.toLowerCase()]) { seen[raw.toLowerCase()] = true; tags.push(raw); }
      });
      if (!tags.length) return;
      tabsEl.hidden = false;
      var buttons = [{ label: 'All', key: 'all', color: 'var(--blm-ink)' }]
        .concat(tags.map(function (t) { return { label: t, key: t.toLowerCase(), color: tagColor(t) }; }));
      tabsEl.innerHTML = buttons.map(function (b) {
        return '<button type="button" class="' + (b.key === activeTag ? 'is-current' : '') + '" data-key="' + b.key + '" style="--tag:' + b.color + ';">' + b.label + '</button>';
      }).join('');
      tabsEl.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          activeTag = btn.getAttribute('data-key');
          page = 1;
          renderTabs();
          renderList();
        });
      });
    }

    var ARROW_PREV = '<svg viewBox="0 0 44 10" aria-hidden="true"><path d="M44 9H1L9 1" fill="none" stroke="currentColor"/></svg>';
    var ARROW_NEXT = '<svg viewBox="0 0 44 10" aria-hidden="true"><path d="M0 9h43L35 1" fill="none" stroke="currentColor"/></svg>';

    function renderPager(total) {
      var pagerEl = document.getElementById('newsPager');
      var pages = Math.ceil(total / PER_PAGE);
      pagerEl.hidden = pages <= 1;
      if (pages <= 1) { pagerEl.innerHTML = ''; return; }
      var html = '<button type="button" class="pager-arrow" data-page="' + (page - 1) + '" aria-label="Previous page"' + (page === 1 ? ' disabled' : '') + '>' + ARROW_PREV + '</button>';
      for (var p = 1; p <= pages; p++) {
        html += '<button type="button" data-page="' + p + '"' + (p === page ? ' class="is-current" aria-current="page"' : '') + '>' + p + '</button>';
      }
      html += '<button type="button" class="pager-arrow" data-page="' + (page + 1) + '" aria-label="Next page"' + (page === pages ? ' disabled' : '') + '>' + ARROW_NEXT + '</button>';
      pagerEl.innerHTML = html;
      pagerEl.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          page = Number(btn.getAttribute('data-page'));
          renderList();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    function renderList() {
      var listEl = document.getElementById('newsList');
      var items = filtered();
      if (!items.length) {
        listEl.innerHTML = '<p class="status-line">No news in this category yet.</p>';
        renderPager(0);
        return;
      }
      var start = (page - 1) * PER_PAGE;
      listEl.innerHTML = items.slice(start, start + PER_PAGE).map(rowHTML).join('');
      renderPager(items.length);
    }

    (async function renderNews() {
      var listEl = document.getElementById('newsList');
      try {
        var rows = await BLM48Data.fetchSheet('News');
        allItems = rows
          .map(function (r) { return Object.assign({}, r, { _date: BLM48Data.fmtDate(r.date) }); })
          .sort(function (a, b) { return b._date.time - a._date.time; });
        tagOrder = [];
        allItems.forEach(function (it) {
          var key = (it.tag || '').trim().toLowerCase();
          if (key && tagOrder.indexOf(key) < 0) tagOrder.push(key);
        });
        tagOrder.sort();

        if (!allItems.length) { listEl.innerHTML = '<p class="status-line">No news yet.</p>'; return; }
        renderTabs();
        renderList();
      } catch (err) {
        listEl.innerHTML = '<p class="status-line">Unable to load news right now.</p>';
      }
    })();
  </script>

</body>
</html>
