<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLM48 Official - Theater</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); color: var(--blm-ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    .theater-logo-container { text-align: center; margin-bottom: 52px; }
    .theater-logo { width: clamp(140px, 26vw, 200px); display: inline-block; }

    .management-zone { display: flex; justify-content: center; gap: clamp(16px, 4vw, 40px); margin: 0 0 72px; flex-wrap: wrap; }

    .admin-card { border: 1px solid var(--blm-line); padding: 32px 26px 26px; width: clamp(240px, 80vw, 280px); text-align: center; position: relative; }
    .admin-card .pill { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); }
    .admin-card img { width: 104px; height: 104px; border-radius: 50%; border: 3px solid var(--blm-gold); object-fit: cover; margin-bottom: 16px; }
    .admin-card .name { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; color: var(--blm-ink); }
    .admin-card .pos { font-size: 0.78rem; color: var(--blm-ink-faint); font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; margin-top: 4px; }

    .section-label {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      font-family: var(--font-display); font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.3px;
      color: var(--blm-ink); margin: 52px 0 26px; padding-bottom: 14px; border-bottom: 2px solid var(--blm-ink);
    }
    .section-label .eyebrow { order: -1; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: clamp(16px, 3vw, 26px); }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }

    .card { position: relative; border: 1px solid var(--blm-line); overflow: hidden; transition: border-color 0.25s, transform 0.25s; }
    @media (hover: hover) { .card:hover { transform: translateY(-6px); border-color: var(--blm-gold); } }
    .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background-color: var(--blm-paper-soft); }

    .info { padding: 14px 12px; text-align: left; }
    .name { font-family: var(--font-display); font-size: clamp(0.92rem, 3vw, 1.02rem); font-weight: 800; color: var(--blm-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pos { font-size: clamp(0.65rem, 2vw, 0.72rem); color: var(--blm-ink-faint); letter-spacing: 0.5px; margin-top: 4px; font-weight: 700; text-transform: uppercase; }

    .captain-badge {
      position: absolute; top: 0; left: 0;
      background: var(--blm-gold); color: var(--blm-on-gold);
      padding: 5px 12px; font-size: 0.62rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; z-index: 10;
    }

    @media (max-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <span class="eyebrow">Live On Stage</span>
      <h1 class="page-hero-title">Theater</h1>
    </div>

    <div class="theater-logo-container">
      <img src="https://lh3.googleusercontent.com/d/1ySjOhJgc8BPvx0raTaUdqRMZS2Ly4L6-=s1000" class="theater-logo" alt="BLM48 Theater Logo">
    </div>

    <div class="management-zone">
      <div class="admin-card">
        <span class="pill pill-gold">Official</span>
        <img src="https://lh3.googleusercontent.com/d/1zXgJmp6jmNjMcnZbc_f4gU9qisrrz0Jq=s400" alt="Gino">
        <div class="name">Gino</div>
        <div class="pos">Shihainin</div>
      </div>
      <div class="admin-card">
        <span class="pill pill-gold">Official</span>
        <img src="https://lh3.googleusercontent.com/d/1FZNJQWvzZxUi4ZfCdTmhWLMTfDtUTZ3p=s400" alt="Emmy">
        <div class="name">Emmy</div>
        <div class="pos">Vice Shihainin</div>
      </div>
    </div>

    <div class="section-label"><span>Team Bloom</span><span class="eyebrow">Main Cast</span></div>
    <div class="grid" id="teamBloom"></div>

    <div class="section-label"><span>Trainee</span><span class="eyebrow">Next Gen</span></div>
    <div class="grid" id="trainee"></div>

  </main>

  <div id="site-footer"></div>

      { name: 'Tine', team: 'Trainee', pos: '5th Gen', img: '1i0jRXb_Zmi8Rt3q7PVfRbJ4T-jMGjkPw' }
    ];

    function init() {
      const bloomContainer = document.getElementById('teamBloom');
      const traineeContainer = document.getElementById('trainee');
      bloomContainer.innerHTML = '';
      traineeContainer.innerHTML = '';

      members.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${m.pos === 'Captain' ? `<div class="captain-badge">Captain Team Bloom</div>` : ''}
          <img src="https://lh3.googleusercontent.com/d/${m.img}=s600" loading="lazy" alt="${m.name}">
          <div class="info">
            <div class="name">${m.name}</div>
            <div class="pos">${m.pos}</div>
          </div>
        `;

        if (m.team === 'Bloom') bloomContainer.appendChild(card);
        else traineeContainer.appendChild(card);
      });
    }

    init();
  </script>
</body>
</html>
