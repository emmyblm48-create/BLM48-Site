<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLM48 Official - THEATER</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1flevUZLFmIodF1RHG0QgRJkCMpgW1KM7=s1000">

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      color: var(--blm-ink);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Theater Logo --- */
    .theater-logo-container { text-align: center; margin-bottom: 44px; }
    .theater-logo {
      width: clamp(150px, 30vw, 220px);
      display: inline-block;
      filter: drop-shadow(0 6px 16px rgba(253, 222, 92, 0.35));
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* --- Management Section --- */
    .management-zone {
      display: flex;
      justify-content: center;
      gap: clamp(15px, 4vw, 40px);
      margin: 0 0 64px;
      flex-wrap: wrap;
    }

    .admin-card {
      background: var(--glass-cream);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      box-shadow: var(--glass-highlight);
      border-radius: var(--radius-xl);
      padding: 30px 24px 24px;
      width: clamp(240px, 80vw, 280px);
      text-align: center;
      position: relative;
    }

    .admin-card .pill {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
    }

    .admin-card img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid var(--blm-gold);
      object-fit: cover;
      margin-bottom: 16px;
    }
    .admin-card:nth-child(2) img { border-color: var(--blm-pink); }

    .admin-card .name {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--blm-ink);
    }

    .admin-card .pos {
      font-size: 0.82rem;
      color: var(--blm-ink-soft);
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* --- Members Section --- */
    .section-label {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 500;
      color: var(--blm-ink);
      margin: 46px 0 24px;
      padding-bottom: 12px;
      border-bottom: 3px solid var(--blm-cream);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }
    .section-label i {
      color: var(--blm-gold-deep);
      font-size: 18px;
    }
    .section-label.pink i { color: var(--blm-pink-deep); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: clamp(15px, 3vw, 25px);
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }

    .card {
      position: relative;
      background: var(--glass-bg-strong);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--glass-shadow), var(--glass-highlight);
      transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (hover: hover) {
      .card:hover { transform: translateY(-8px); box-shadow: var(--shadow-hover); }
    }

    .card img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      background-color: var(--blm-cream);
    }

    .info {
      padding: 14px 10px;
      background: transparent;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    .name {
      font-family: var(--font-display);
      font-size: clamp(0.9rem, 3vw, 1.02rem);
      font-weight: 500;
      color: var(--blm-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pos {
      font-size: clamp(0.65rem, 2vw, 0.72rem);
      color: var(--blm-ink-faint);
      letter-spacing: 0.5px;
      margin-top: 4px;
      font-weight: 600;
    }

    .captain-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--blm-gold);
      color: var(--blm-on-gold);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.63rem;
      font-weight: 800;
      letter-spacing: 1px;
      z-index: 10;
    }

    @media (max-width: 680px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
    }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/nav.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <h1 class="page-hero-title" data-i18n="theater_header">THEATER</h1>
      <div class="page-hero-underline"></div>
    </div>

    <!-- โลโก้เธียร์เตอร์ -->
    <div class="theater-logo-container">
      <img src="https://lh3.googleusercontent.com/d/1ySjOhJgc8BPvx0raTaUdqRMZS2Ly4L6-=s1000" class="theater-logo" alt="BLM48 Theater Logo">
    </div>

    <!-- Shihainin Section -->
    <div class="management-zone">
      <div class="admin-card">
        <span class="pill pill-gold">OFFICIAL</span>
        <img src="https://lh3.googleusercontent.com/d/1zXgJmp6jmNjMcnZbc_f4gU9qisrrz0Jq=s400" alt="Gino">
        <div class="name">Gino</div>
        <div class="pos" data-i18n="pos_shihainin">Shihainin</div>
      </div>
      <div class="admin-card">
        <span class="pill pill-gold">OFFICIAL</span>
        <img src="https://lh3.googleusercontent.com/d/1FZNJQWvzZxUi4ZfCdTmhWLMTfDtUTZ3p=s400" alt="Emmy">
        <div class="name">Emmy</div>
        <div class="pos" data-i18n="pos_vice_shihainin">Vice Shihainin</div>
      </div>
    </div>

    <!-- Team Bloom -->
    <div class="section-label"><i class="fas fa-seedling" aria-hidden="true"></i> <span data-i18n="team_bloom_label">TEAM BLOOM</span></div>
    <div class="grid" id="teamBloom"></div>

    <!-- Trainee -->
    <div class="section-label pink"><i class="far fa-gem" aria-hidden="true"></i> <span data-i18n="trainee_label">TRAINEE</span></div>
    <div class="grid" id="trainee"></div>

  </main>

  <!-- Footer -->
  <div id="site-footer"></div>

  <script>

      { name: 'Hana', team: 'Bloom', pos: '3rd Gen', img: '1SMotb8tFKbIDC74i_dbPS1Bx5IdBKBK8' },
      { name: 'Jayden', team: 'Bloom', pos: '3rd Gen', img: '17zGGHiIOP7PvdsqUuKq3MRpHhL8hgsn8' },
      { name: 'Mayfie', team: 'Bloom', pos: '4th Gen', img: '1_S-fWsZZwjkXfmdTj3jpDA4XdJeQixLs' },
      { name: 'Mushroom', team: 'Bloom', pos: '3rd Gen', img: '1h1eW8OP8UOaJm8kRK-13t-1Z_WhNluy9' },
      { name: 'Noel', team: 'Bloom', pos: '2nd Gen', img: '1nVIgsUPv5jr0SaAlbbaw4YM8dPgLneuD' },
      { name: 'Quantum', team: 'Bloom', pos: '4th Gen', img: '19zL2mLOrLhHOUHMc94ZM7Vmc57Mut97D' },

      { name: 'Arlua', team: 'Trainee', pos: '4th Gen', img: '1rzP_iY1akOLolmDYJ5r1RSIFbz1tiuvj' },

    ];

    function T(key) {
      return (window.BLM48_I18N && window.BLM48_I18N.t(key)) || key;
    }

    function init() {
      const bloomContainer = document.getElementById('teamBloom');
      const traineeContainer = document.getElementById('trainee');
      bloomContainer.innerHTML = '';
      traineeContainer.innerHTML = '';

      members.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${m.pos === 'Captain' ? `<div class="captain-badge">${T('captain_badge')}</div>` : ''}
          <img src="https://lh3.googleusercontent.com/d/${m.img}=s600" loading="lazy" alt="${m.name}">
          <div class="info">
            <div class="name">${m.name}</div>
            <div class="pos">${m.pos}</div>
          </div>
        `;

        if(m.team === 'Bloom') bloomContainer.appendChild(card);
        else traineeContainer.appendChild(card);
      });
    }

    init();
    document.addEventListener('blm48:langchange', init);
  </script>
</body>
</html>
